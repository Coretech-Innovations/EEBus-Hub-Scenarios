  /trust:
    get:
      tags:
        - Trust
      summary: List the current trust topology (all mutual-trust connections)
      operationId: listTrustConnections
      responses:
        '200':
          description: >-
            The list of trust connections, each annotated with its live
            connection state (`established`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrustEdgeStatus"
    post:
      tags:
        - Trust
      summary: Create a mutual-trust connection between two devices
      description: >-
        Establishes a bidirectional trust relationship between two peers. Each
        peer is identified either by a simulated entity id or by a real device
        SKI. The backend validates the device-type connection rules, records the
        connection, and (re)applies it on every simulation start.
      operationId: addTrustConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustEdge"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusOk"
        '400':
          description: invalid or disallowed connection
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - Trust
      summary: Remove a mutual-trust connection between two devices
      operationId: removeTrustConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustEdge"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/statusOk"
        '400':
