openapi: 3.0.0
info:
  title: EEBUS-Hub
  version: 0.0.0
  description: |-
    This is a yaml file for the EEBus-Hub
servers:
  - url: /api/v1
tags:
  - name: SIM
  - name: EV
  - name: EVSE
  - name: HEMS
  - name: Heat Pump
  - name: Uncontrollable Device
  - name: Energy Meter
  - name: Internal Meter
  - name: Real Devices
  - name: Testing
  - name: Inverter
  - name: ControlBox
  - name: License
  - name: Version
  - name: Updates
  - name: Power Limitation
paths:
  /powerLimitation/view:
    get:
      tags:
        - Power Limitation
      summary: Get the combined LPC/LPP view of every known device
      description: >-
        Returns one entry per device that participates in LPC (Limitation of Power
        Consumption) and/or LPP (Limitation of Power Production), covering both the
        devices the hub simulates and the external (real) devices it observes as Energy
        Guard. A device that runs both use cases appears once with both sections filled.


        The controllable-system state (Init, Limited, Failsafe, ...) is only present for
        simulated devices: it is a hub-internal state machine that is not propagated over
        the EEBUS protocol and therefore cannot be known for an external device.


        Changes to any of this data are announced on the event stream as the
        `LpcLppViewUpdate` event.
      operationId: getPowerLimitationView
      responses:
        '200':
          description: Combined LPC/LPP view of simulated and external devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LpcLppViewSnapshot"
        '500':
          description: the simulation engine is not available
  /sim:
    post:
      tags:
        - SIM
      summary: An Api to handle different actions with Simulation (start,stop,reset)
      operationId: postSimulation
      parameters:
        - name: X-EEBUS-Internal-Test-Token
          in: header
          required: false
          description: Internal token used by test automation to authorize simulation start while a test run is active.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/simulationParameters"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/simulationResponseOk"
        '400':
          description: Unknown action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/simulationResponseBadRequest"
        '409':
          description: Simulation start is blocked while tests are running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    get:
      tags:
        - SIM
      summary: Get Simulation status
      operationId: getSimulationStatus
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  response:
                    $ref: "#/components/schemas/simulationStatus"
  /sim/undo:
    post:
      tags:
        - SIM
      summary: Undo the last action
      operationId: undo
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400': 
          description: nothing to undo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/redo:
    post:
      tags:
        - SIM
      summary: Redo last action has been Undone
      operationId: redo
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400': 
          description: nothing to redo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/speedfactor:
    patch:
      tags:
        - SIM
      summary: Modify speed factor
      operationId: modifySpeedFactor
      requestBody:
        content:
            application/json:
              schema:
               type: object
               properties:
                  speedFactor:
                    type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: 
                 $ref: "#/components/schemas/statusOk"
        '400':
          description: simulation is still running
          content:
            application/json:
              schema: 
                 $ref: "#/components/schemas/statusError"
  /sim/save:
    post:
      tags:
        - SIM
      summary: Save the current state to be exported, This also clear the Undone action
      operationId: save
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
    get:
      tags:
        - SIM
      summary: Update logger data
      operationId: saveupdate
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
               type: object
               properties:
                  status:
                    type: boolean
  /sim/export:
    get:
      tags:
        - SIM
      summary: Export the current configuration to json file
      operationId: exportFile
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationExport"
        '404':
          description: No actions found to be exported
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
        '500':
          description: Failed to encode actions to json
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
  /sim/import:
    post:
      tags:
        - SIM
      summary: Import Configuration to be loaded in the system
      operationId: importFile
      description: >-
        Accepts a multipart/form-data upload with a `file` field holding a
        simulation export produced by GET /sim/export (SimulationExport). The
        legacy bare JSON array of action objects exported by older Hub versions
        is also accepted.
      responses:
        '200':
          description: >-
            Successful response. `status` is false when the configuration was
            rejected as already present in the running simulation; trust
            connections that could not be restored are logged and do not fail
            the import.
          content:
            application/json:
              schema:
               type: object
               properties:
                  status:
                    type: boolean
        '400':
          description: >-
            File not found, file size mismatch, empty file, or the file is not
            a valid simulation export
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
        '500': 
          description: Failed to load file, or the simulation engine is unavailable
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
  /sim/log/start:
    post:
      tags:
        - SIM
      summary: start logging the APIs that backend is receiving
      operationId: startLogging
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: logging has been started before
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
  /sim/log/stop:
    post:
      tags:
        - SIM
      summary: stop logging and get the logs have been saved
      operationId: getLogs
      responses:
        '200':
          description: Successful response
          content:
            multipart/form-data:
              schema:
                type: string
        '400':
          description: no logging have been started to be "Stopped"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/log/clear:
    post:
      tags:
        - SIM
      summary: clear the logs
      operationId: clearLogs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
  /sim/usecases:
    patch:
      tags:
        - SIM
      summary: Enable or disable usecases in runtime
      operationId: usecasesRuntime
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UseCasesAvailability"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  request:
                    $ref: "#/components/schemas/UseCasesAvailability"
    get:
      tags:
        - SIM
      summary: Get usecases availability
      operationId: getUsecasesAvailability
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  usecasesEnable:
                    $ref: "#/components/schemas/UseCasesAvailability"
  /sim/logs/{action}:
    post:
      tags:
        - SIM
      summary: Start or Stop Logging at specific time
      operationId: loggingAction
      parameters:
        - name: action
          in: path
          schema:
            type: string
          required: true
          example: start
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: Invalid action entered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/logs/eebuslogs:
    get:
      tags:
        - SIM
      summary: get the EEBus logs from starting the logging till the stop
      operationId: getEEBusLogs
      responses:
        '200':
          description: Successful response
          content:
            multipart/form-data:
              schema:
                type: string
        '400':
          description: either no logs created, or the logging is not stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/logs/eventlogs:
    get:
      tags:
        - SIM
      summary: get the event logs from starting the logging till the stop
      operationId: getEventLogs
      responses:
        '200':
          description: Successful response
          content:
            multipart/form-data:
              schema:
                type: string
        '400':
          description: either no logs created, or the logging is not stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/logState:
    get:
      tags:
        - SIM
      summary: Get the state of the API logging, if the backend in logging the received APIs or not
      operationId: getAPILoggingState
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APILoggingState"
  /sim/eebuslog:
    get:
      tags:
        - SIM
      summary: Get EEBUS log file
      operationId: getEEBUSLog
      responses:
        '200':
          description: Successful response - file download
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Log file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/eebuslogfile:
    get:
      tags:
        - SIM
      summary: Get EEBUS log file path
      operationId: getEEBUSLogFilePath
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  filepath:
                    type: string
        '404':
          description: Log file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/LPView:
    get:
      tags:
        - SIM
      summary: Get LP logger data
      operationId: getLPView
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - SIM
      summary: Clear LP logger data
      operationId: clearLPView
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/ExportLPView:
    get:
      tags:
        - SIM
      summary: Export LP logs to CSV
      operationId: exportLPView
      responses:
        '200':
          description: Successful response - CSV download
          content:
            text/csv:
              schema:
                type: string
        '404':
          description: No data to export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/EVLimitLogs:
    get:
      tags:
        - SIM
      summary: Get the OPEV/OSCEV EV limit log
      description: >
        Returns every OPEV and OSCEV limit exchange recorded so far, in insertion
        order. Each exchange is one entry, carrying the EV's accept/reject outcome.
      operationId: getEVLimitLogs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EVLimitEvent"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - SIM
      summary: Clear the EV limit log
      operationId: clearEVLimitLogs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/ExportEVLimitLogs:
    get:
      tags:
        - SIM
      summary: Export the EV limit log to CSV
      description: >
        Exports the EV limit log as CSV, sorted by timestamp. Any query parameter
        below filters the export; passing no parameters exports everything.
      operationId: exportEVLimitLogs
      parameters:
        - name: useCase
          in: query
          required: false
          schema:
            type: string
            enum: [OPEV, OSCEV]
        - name: limitState
          in: query
          required: false
          schema:
            type: string
            enum: [Applied, Accepted, Rejected, Expired, Timed-out]
        - name: evId
          in: query
          required: false
          schema:
            type: integer
        - name: sourceAddress
          in: query
          required: false
          schema:
            type: string
        - name: destinationAddress
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful response - CSV download
          content:
            text/csv:
              schema:
                type: string
        '404':
          description: No logs match the given filter parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/MPCLogs:
    get:
      tags:
        - SIM
      summary: Get MPC logger data
      operationId: getMPCLogs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - SIM
      summary: Clear MPC logs
      operationId: clearMPCLogs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/ExportMPCLogs:
    get:
      tags:
        - SIM
      summary: Export MPC logs to CSV
      operationId: exportMPCLogs
      responses:
        '200':
          description: Successful response - CSV download
          content:
            text/csv:
              schema:
                type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/MGCPLogs:
    get:
      tags:
        - SIM
      summary: Get MGCP logger data (per-notify snapshots from MGCP MA callback)
      operationId: getMGCPLogs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MGCPEvent"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - SIM
      summary: Clear MGCP logs
      operationId: clearMGCPLogs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/ExportMGCPLogs:
    get:
      tags:
        - SIM
      summary: Export MGCP logs to CSV
      operationId: exportMGCPLogs
      responses:
        '200':
          description: Successful response - CSV download
          content:
            text/csv:
              schema:
                type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/TCPServer:
    get:
      tags:
        - SIM
      summary: Get TCP server status
      operationId: getTCPServerStatus
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  port:
                    type: string
    patch:
      tags:
        - SIM
      summary: Configure TCP server
      operationId: configureTCPServer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                port:
                  type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: Invalid configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /mdns:
    get:
      summary:  get the available mDNS entries in the network
      operationId: getAvailableMdnsDevices
      responses:
        '200':
          description: successful response
          content:
            application/json:
              schema:
                title: array of the found entries
                type: array
  /ev/view:
    get:
      tags:
        - EV
      summary: Get aggregated EV view data
      operationId: getEVView
      responses:
        '200':
          description: Aggregated simulated and HEMS-discovered remote EV view data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EVViewSnapshot"
        '403':
          description: entity is not licensed
  /ev/add:
    post:
      tags:
        - EV
      summary: Add New EV
      operationId: addEV
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EVConfig" 
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/EVAddResponseOk"
  /ev/list:
    get:
      tags:
        - EV
      summary: List all existed EVs
      operationId: listEVs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/EVList"
  /ev/{evId}:
    patch:
      tags:
        - EV
      summary: Modify EV
      operationId: modifyEV
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EVConfig"
      parameters:
        - name: evId
          in: path
          schema:
            type: integer
          required: true
          example: 2
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                properties:
                  changes:
                    $ref: "#/components/schemas/EVConfig"
                  new:
                    $ref: "#/components/schemas/EVConfig"
                  old:
                    $ref: "#/components/schemas/EVConfig"                
        '400':
          description: invalid ID number
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
        '404':
          description: no existing EV with this ID number
          content:
            application/json:
              schema: 
                 $ref: "#/components/schemas/invalidId"
    get:
      tags:
        - EV
      summary: get EV
      operationId: getEV
      parameters:
        - name: evId
          in: path
          schema:
            type: integer
          required: true
          example: 2
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EVConfig"
                  - type: object
                    properties:
                      evId:
                        type: integer
                      connectedToEVSE:
                        type: boolean
                      evseId:
                        type: integer
        '400':
          description: invalid ID number
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
        '404':
          description: no existing EV with this ID number
          content:
            application/json:
              schema: 
                 $ref: "#/components/schemas/invalidId"
    delete:
      tags:
        - EV
      summary: Delete EV
      operationId: deleteEV
      parameters:
        - name: evId
          in: path
          schema:
            type: integer
          required: true
          example: 2
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/EVDelete"
        '400':
          description: invalid ID number
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
        '404':
          description: no existing EV with this ID number
          content:
            application/json:
              schema: 
                 $ref: "#/components/schemas/invalidId"
  /ev/{evId}/evse/{evseId}:
    post:
      tags:
        - EV
      summary: Connect EV to existing EVSE
      operationId: connectToEVSE
      parameters:
        - name: evId
          in: path
          schema:
            type: integer
          required: true
          example: 2
        - name: evseId
          in: path
          schema:
            type: integer
          required: true
          example: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusOk"
        '400':
          description: invalid ID number
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
        '404':
          description: no existing EV with this ID number
          content:
            application/json:
              schema: 
                 $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - EV
      summary: Disconnect EV from EVSE
      operationId: disconnectFromEVSE
      parameters:
        - name: evId
          in: path
          schema:
            type: integer
          required: true
          example: 2
        - name: evseId
          in: path
          schema:
            type: integer
          required: true
          example: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusOk"
        '400':
          description: invalid ID number
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
        '404':
          description: no existing EV with this ID number
          content:
            application/json:
              schema: 
                 $ref: "#/components/schemas/statusError"
  /ev/{evId}/opev:
    get:
      tags:
        - EV
      summary: Get EV OPEV state
      description: >
        Returns the OPEV per-phase load-control limits the EV is currently operating
        under, together with the OPEV connection, heartbeat and controller operating
        state. Limits are read from the EV's live SPINE LoadControl feature.
      operationId: getEVOPEVState
      parameters:
        - name: evId
          in: path
          schema:
            type: integer
          required: true
          example: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpevEVState"
        '400':
