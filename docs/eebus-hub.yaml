  /hems/opev/ev/{address}/current:
    patch:
      tags:
        - HEMS
      summary: Manually send per-phase OPEV current limits to an EV
      description: >
        Writes per-phase OPEV overload-protection current limits to the EV as a partial
        write. Only phases present in the body are written. The HEMS is a testing device:
        values are NOT range-checked and the EV's IsLimitChangeable flag is not enforced,
        so a tester can send arbitrary/invalid limits and observe the EV's reaction. The
        response reports which phases were written and which were skipped because their
        limit ID could not be discovered from the EV's descriptors.
      operationId: sendHEMSOPEVCurrentLimit
      parameters:
        - name: address
          in: path
          description: URL-encoded SPINE entity address of the EV
          schema:
            type: string
          required: true
          example: d:_n:SIMCT_EV-1-4b528987
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpevCurrentLimitRequest"
      responses:
        '200':
          description: Limit sent and accepted by the EV
          content:
            application/json:
              schema:
                type: object
                properties:
                  written:
                    type: array
                    items:
                      type: string
                  skipped:
                    type: array
                    items:
                      type: string
        '400':
          description: send failed or was rejected by the EV (see err), with written/skipped phases
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                  written:
                    type: array
                    items:
                      type: string
                  skipped:
                    type: array
                    items:
                      type: string
        '403':
          description: OPEV use case is not licensed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '404':
          description: no HEMS found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /hems/oscev/ev/{address}/current:
    patch:
      tags:
        - HEMS
      summary: Send a per-phase OSCEV current recommendation to an EV
      description: >
        Sends a per-phase OSCEV current recommendation. Only phases present in the body are
        written (partial write), and each phase's IsLimitActive is honored independently
        (send active=false to deactivate a phase). The HEMS is a testing device: values are
        NOT range-checked, so negative / out-of-range values are allowed.
      operationId: sendHEMSOSCEVCurrentLimit
      parameters:
        - name: address
          in: path
          description: URL-encoded SPINE entity address of the EV
          schema:
            type: string
          required: true
          example: d:_n:SIMCT_EV-1-4b528987
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OscevCurrentLimitRequest"
      responses:
        '200':
          description: Recommendation sent and accepted by the EV
          content:
            application/json:
              schema:
                type: object
                properties:
                  written:
                    type: array
                    items:
                      type: string
        '400':
          description: send failed or was rejected by the EV (see err)
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                  written:
                    type: array
                    items:
                      type: string
        '403':
          description: OSCEV use case is not licensed or is disabled on the HEMS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '404':
          description: no HEMS found or no EV found at this address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /hems/oscev/ev/{address}/power:
    patch:
      tags:
        - HEMS
      summary: Send OSCEV power recommendation to an EV
      description: >
        Sends an OSCEV power recommendation. The HEMS is a testing device: the value is NOT
        range-checked and the EV's scenario-4 support is NOT required, so a tester can send
        a power recommendation to an EV that does not advertise scenario 4 (or an
        out-of-range value) and observe how it responds.
      operationId: sendHEMSOSCEVPowerRecommendation
      parameters:
        - name: address
          in: path
          description: URL-encoded SPINE entity address of the EV
          schema:
            type: string
          required: true
          example: d:_n:SIMCT_EV-1-4b528987
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OscevPowerRecommendationRequest"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OscevPowerRecommendationResponse"
        '400':
          description: invalid power recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          description: OSCEV use case is not licensed or is disabled on the HEMS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '404':
          description: no HEMS found or no EV found at this address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
