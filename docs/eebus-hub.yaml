          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OhpcfAnnouncementParams"
      responses:
        '200':
          description: Optional process announced successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: Optional process announced successfully
                  hpId:
                    type: integer
                    example: 1
                  ohpcfData:
                    $ref: "#/components/schemas/OhpcfMonitorData"
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid announcement parameters or EEBUS validation failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    example: Failed to announce optional process
                  message:
                    type: string
                    example: at least one interruption method required
                  hpId:
                    type: integer
        '404':
