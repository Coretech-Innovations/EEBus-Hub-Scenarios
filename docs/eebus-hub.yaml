        Body of PATCH /inverter/:id/pvstring/values — DC/extra overrides pinned while the
        PV string is in testing mode (400 otherwise). Every field optional.
      type: object
      properties:
        forcedPowerInWatts:
          type: number
          description: DC production power pinned verbatim (negative = producing).
        forcedCurrentInAmpere:
          type: number
          description: DC current pinned verbatim (else derived).
        forcedVoltageInVolts:
          type: number
          description: DC voltage pinned verbatim (else the configured voltage).
        forcedEnergyInWattHours:
          type: number
          description: DC energy counter pinned verbatim.
        forcedInsulationResistanceInOhm:
          type: number
          description: Insulation resistance pinned verbatim.
        forcedComponentTemperatureInDegC:
          type: number
          description: Component temperature pinned verbatim.
    PVStringStatus:
      title: PV string configuration and live values
      type: object
      properties:
        maxPowerInWatts:
          type: number
        nominalVoltageInVolts:
          type: number
        sunFactor:
          type: number
        productionEnabled:
          type: boolean
        powerInWatts:
          type: number
          description: Live DC power; negative while producing.
        currentInAmpere:
          type: number
        energyInWattHours:
          type: number
        insulationResistanceInOhm:
          type: number
        componentTemperatureInDegC:
          type: number
        mode:
          $ref: "#/components/schemas/DeviceSimulationMode"
        forcedCurrentInAmpere:
          type: number
          nullable: true
          description: The DC current pin active in testing mode, if any.
        forcedVoltageInVolts:
          type: number
          nullable: true
          description: The DC voltage pin active in testing mode, if any.
    DeviceSimulationMode:
      title: Device simulation mode
      type: string
      enum:
        - simulation
        - testing
      description: >-
        Whether a device's reported values are driven by the hub's simulation
        logic (simulation) or pinned to user-supplied values and reported
        verbatim (testing, a hard override that ignores DUT limits).
    TestingPerPhaseAC:
      title: Per-phase AC testing-mode pins
      description: >-
        Per-phase AC overrides shared by every AC device. Each field is optional;
        omitted leaves the quantity derived. Applied verbatim in testing mode.
      type: object
      properties:
        forcedCurrentPhaseAInAmpere:
          type: number
        forcedCurrentPhaseBInAmpere:
          type: number
        forcedCurrentPhaseCInAmpere:
          type: number
        forcedVoltagePhaseAInVolts:
          type: number
        forcedVoltagePhaseBInVolts:
          type: number
        forcedVoltagePhaseCInVolts:
          type: number
        forcedFrequencyInHertz:
          type: number
    TestingPerPhasePower:
      title: Per-phase AC power testing-mode pins
      description: >-
        Per-phase AC power overrides for devices whose catalog reports per-phase
        power (inverter, EVSE). Each field is optional.
      type: object
      properties:
        forcedPowerPhaseAInWatts:
          type: number
        forcedPowerPhaseBInWatts:
          type: number
        forcedPowerPhaseCInWatts:
          type: number
    TestingInverterMOI:
      title: Inverter MOI (Monitoring of Inverter) testing-mode pins
      description: >-
        The AC quantities the inverter reports through the MOI use case beyond MPC.
        forcedPowerFactor drives apparent and reactive power through the hub's
        formula; the apparent/reactive fields additionally override those verbatim.
        Every field optional.
      type: object
      properties:
        forcedPowerFactor:
          type: number
        forcedApparentPowerTotalInVoltAmpere:
          type: number
        forcedApparentPowerPhaseAInVoltAmpere:
          type: number
        forcedApparentPowerPhaseBInVoltAmpere:
          type: number
        forcedApparentPowerPhaseCInVoltAmpere:
          type: number
        forcedReactivePowerTotalInVoltAmpere:
          type: number
        forcedReactivePowerPhaseAInVoltAmpere:
          type: number
        forcedReactivePowerPhaseBInVoltAmpere:
          type: number
        forcedReactivePowerPhaseCInVoltAmpere:
          type: number
        forcedComponentTemperatureInDegC:
          type: number
        forcedAcYieldTotalInWattHours:
          type: number
        forcedAcYieldDayInWattHours:
          type: number
        forcedAcYieldMonthInWattHours:
          type: number
        forcedAcYieldYearInWattHours:
          type: number
    TestingLiveReadings:
      title: Currently-reported (effective) device values
      description: >-
        The device's current effective readings — the forced pins where set, the
        simulation values elsewhere. Returned on every mode-status response so a
        testing-mode form can open pre-filled with the current values. Per-phase power
        is absent for devices with no per-phase power (heat pump, EV).
      type: object
      properties:
        totalPowerInWatts:
          type: number
        powerPhaseAInWatts:
          type: number
        powerPhaseBInWatts:
          type: number
        powerPhaseCInWatts:
          type: number
        currentPhaseAInAmpere:
          type: number
        currentPhaseBInAmpere:
          type: number
        currentPhaseCInAmpere:
          type: number
        voltagePhaseAInVolts:
          type: number
        voltagePhaseBInVolts:
          type: number
        voltagePhaseCInVolts:
          type: number
        frequencyInHertz:
          type: number
        stateOfChargeInPercent:
          type: number
          description: Set only for the EV.
        powerFactor:
          type: number
          description: MOI live values, set only for the inverter.
        apparentPowerTotalInVoltAmpere:
          type: number
        reactivePowerTotalInVoltAmpere:
          type: number
        componentTemperatureInDegC:
          type: number
        acYieldTotalInWattHours:
          type: number
        acYieldDayInWattHours:
          type: number
        acYieldMonthInWattHours:
          type: number
        acYieldYearInWattHours:
          type: number
    SimulationModeRequest:
      title: Simulation/testing mode toggle
      description: Body of PATCH /{device}/:id/mode — toggles the mode only.
      type: object
      required:
        - testingMode
      properties:
        testingMode:
          type: boolean
          description: True enables testing mode, false returns to simulation.
    EVForcedValuesRequest:
      title: EV forced-values request
      description: >-
        Body of PATCH /ev/:id/values — measurement overrides pinned while in testing
        mode. Every field is optional; an omitted field keeps its current value.
      allOf:
        - $ref: "#/components/schemas/TestingPerPhaseAC"
        - type: object
          properties:
            forcedPowerInWatts:
              type: number
              description: Total AC charging power pinned in testing mode (positive = charging, negative = discharging).
            forcedStateOfChargeInPercent:
              type: number
              description: State of charge pinned in testing mode, 0..100.
    EVModeStatus:
      title: EV simulation/testing mode status
      allOf:
        - $ref: "#/components/schemas/TestingPerPhaseAC"
        - type: object
          properties:
            mode:
              $ref: "#/components/schemas/DeviceSimulationMode"
            forcedPowerInWatts:
              type: number
              nullable: true
            forcedStateOfChargeInPercent:
              type: number
              nullable: true
            live:
              $ref: "#/components/schemas/TestingLiveReadings"
    EVSEForcedValuesRequest:
      title: EVSE forced-values request
      description: >-
        Body of PATCH /evse/:id/values — measurement overrides pinned while in testing
        mode. Every field is optional; an omitted field keeps its current value.
      allOf:
        - $ref: "#/components/schemas/TestingPerPhaseAC"
        - $ref: "#/components/schemas/TestingPerPhasePower"
        - type: object
          properties:
            forcedPowerInWatts:
              type: number
              description: Total power pinned in testing mode, split evenly across the three phases.
    EVSEModeStatus:
      title: EVSE simulation/testing mode status
      allOf:
        - $ref: "#/components/schemas/TestingPerPhaseAC"
        - $ref: "#/components/schemas/TestingPerPhasePower"
        - type: object
          properties:
            mode:
              $ref: "#/components/schemas/DeviceSimulationMode"
            forcedPowerInWatts:
              type: number
              nullable: true
            currentState:
              $ref: "#/components/schemas/CSState"
            live:
              $ref: "#/components/schemas/TestingLiveReadings"
    HeatPumpForcedValuesRequest:
      title: Heat pump forced-values request
      description: >-
        Body of PATCH /heatpump/:id/values — measurement overrides pinned while in
        testing mode. Every field is optional; an omitted field keeps its current value.
      allOf:
        - $ref: "#/components/schemas/TestingPerPhaseAC"
        - type: object
          properties:
            forcedPowerInWatts:
              type: number
              description: Total power pinned in testing mode.
    HeatPumpModeStatus:
      title: Heat pump simulation/testing mode status
      allOf:
        - $ref: "#/components/schemas/TestingPerPhaseAC"
        - type: object
          properties:
            mode:
              $ref: "#/components/schemas/DeviceSimulationMode"
            forcedPowerInWatts:
              type: number
              nullable: true
            currentState:
              $ref: "#/components/schemas/CSState"
            ohpcfState:
              type: string
              description: >-
                Live OHPCF power-sequence state (empty only if OHPCF not supported).
            ohpcfSupported:
              type: boolean
              description: >-
                True when the heatpump exposes the OHPCF feature; the UI shows the
                Force OHPCF State control only then.
            live:
              $ref: "#/components/schemas/TestingLiveReadings"
    InverterForcedValuesRequest:
      title: Inverter AC-level forced-values request
      description: >-
        Body of PATCH /inverter/:id/values — pins the inverter's AC MPC report verbatim
        while in testing mode. The inverter's AC values are otherwise derived from its
        battery/PV sub-devices. The inverter reports no per-phase power over SPINE, so it
        has no per-phase power pins. Every field optional.
      allOf:
        - $ref: "#/components/schemas/TestingPerPhaseAC"
        - $ref: "#/components/schemas/TestingInverterMOI"
        - type: object
          properties:
            forcedTotalPowerInWatts:
              type: number
              description: Total AC power pinned in testing mode.
    InverterModeStatus:
      title: Inverter AC-level simulation/testing mode status
      allOf:
        - $ref: "#/components/schemas/TestingPerPhaseAC"
        - $ref: "#/components/schemas/TestingInverterMOI"
        - type: object
          properties:
            mode:
              $ref: "#/components/schemas/DeviceSimulationMode"
            forcedTotalPowerInWatts:
              type: number
              nullable: true
            lpcState:
              $ref: "#/components/schemas/CSState"
            lppState:
              $ref: "#/components/schemas/CSState"
            live:
              $ref: "#/components/schemas/TestingLiveReadings"
    InverterControlBlock:
      title: Inverter status and control information
      type: object
      properties:
        inverterId:
          type: integer
        DeviceInfo:
          $ref: "#/components/schemas/InverterInfo"
        ski:
          type: string
        deviceAddress:
          type: string
        connectedToHEMS:
          type: boolean
        remoteSki:
          type: string
        LPCCurrentState:
          type: string
        LPPCurrentState:
          type: string
        DeviceState:
          type: object
    ControlBoxInfo:
      title: ControlBox configuration
      type: object
      properties:
        trustConnections:
          type: array
          description: Optional peers to mutually trust when the simulation starts.
          items:
            $ref: "#/components/schemas/TrustPeerRef"
        DeviceName:
          type: string
        vendorCode:
          type: string
        deviceBrand:
          type: string
        deviceModel:
          type: string
        serialNumber:
          type: string
        ImgBase64:
          type: string
        heartbeatState:
          type: string
        lpcUseCaseEnabled:
          type: boolean
        mpcUseCaseEnabled:
          type: boolean
        lppUseCaseEnabled:
          type: boolean
    ControlBoxPairRequest:
      title: ControlBox pair request
      type: object
      properties:
        remoteSki:
          type: string
        deviceAddress:
          type: string
    LpcLppViewSnapshot:
      title: LPC/LPP limitation view snapshot
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/LpcLppViewEntry"
        simulatedCount:
          type: integer
          description: Number of entries sourced from the hub's own simulated devices.
        externalCount:
          type: integer
          description: Number of entries sourced from external devices observed as Energy Guard.
    LpcLppViewEntry:
      title: LPC/LPP limitation view entry
      type: object
      properties:
        displayName:
          type: string
          description: >-
            Configured device name for simulated devices; the SPINE device address for
            external ones.
        deviceAddress:
          type: string
          description: SPINE device address. Empty while a simulated device's EEBUS service is not running.
        ski:
          type: string
          description: SHIP SKI of the device.
        source:
          type: string
          enum:
            - simulated
            - external
        simulatedEntityId:
          type: integer
          description: Engine entity id. Only present when source is `simulated`.
        availableUseCases:
          $ref: "#/components/schemas/LpcLppViewUseCases"
        lpc:
          $ref: "#/components/schemas/LpcLppViewLpcSection"
        lpp:
          $ref: "#/components/schemas/LpcLppViewLppSection"
    LpcLppViewUseCases:
      title: LPC/LPP use case availability
      type: object
      properties:
        lpc:
          type: boolean
        lpp:
          type: boolean
    LpcLppViewLpcSection:
      title: LPC block of a limitation view entry
      type: object
      properties:
        state:
          allOf:
            - $ref: "#/components/schemas/CSState"
          description: >-
            Controllable system state. Only present for simulated devices — the state
            machine is hub-internal and is not propagated over EEBUS.
        activePowerConsumptionLimit:
          $ref: "#/components/schemas/lpcAPCL"
        failsafeActivePowerConsumption:
          $ref: "#/components/schemas/FCAPL"
        powerConsumptionConstraints:
          $ref: "#/components/schemas/LpcLppViewConsumptionConstraints"
    LpcLppViewLppSection:
      title: LPP block of a limitation view entry
      type: object
      properties:
        state:
          allOf:
            - $ref: "#/components/schemas/CSState"
          description: >-
            Controllable system state. Only present for simulated devices — the state
            machine is hub-internal and is not propagated over EEBUS.
        activePowerProductionLimit:
          $ref: "#/components/schemas/lppAPPL"
        failsafeActivePowerProduction:
          $ref: "#/components/schemas/lppFSAPPL"
        powerProductionConstraints:
          $ref: "#/components/schemas/LpcLppViewProductionConstraints"
    LpcLppViewConsumptionConstraints:
      title: LPC power consumption constraints
      description: >-
        A controllable system declares only the maximum that bounds it — an energy
        management system its contractual maximum, every other device type its own
        nominal maximum. The inapplicable field is omitted rather than reported as zero,
        so an absent field means "not declared by this device".
        LpcLppViewProductionConstraints follows the same convention.
      type: object
      properties:
        powerConsumptionNominalMax:
          type: number
        contractualConsumptionNominalMax:
          type: number
    LpcLppViewProductionConstraints:
      title: LPP power production constraints
      description: >-
        The production-side mirror of LpcLppViewConsumptionConstraints, with the same
        omit-when-inapplicable convention: an absent field means "not declared by this
        device", never "declared as zero".
      type: object
      properties:
        powerProductionNominalMax:
          type: number
        contractualProductionNominalMax:
          type: number
    LpcDeviceData:
      title: LPC data for a specific device
      type: object
      properties:
        deviceAddress:
          type: string
        deviceSki:
          type: string
        apcl:
          $ref: "#/components/schemas/lpcAPCL"
        fscapl:
          $ref: "#/components/schemas/FCAPL"
        constraints:
          type: object
          properties:
            powerConsumptionNominalMax:
              type: number
    LppDeviceData:
      title: LPP data for a specific device
      type: object
      properties:
        deviceAddress:
          type: string
        deviceSki:
          type: string
        appl:
          $ref: "#/components/schemas/lppAPPL"
        fspapl:
          $ref: "#/components/schemas/lppFSAPPL"
        constraints:
          type: object
          properties:
            powerProductionNominalMax:
              type: number
    BatteryManufacturerData:
      title: Battery manufacturer identification
      type: object
      properties:
        batteryType:
          type: string
        capacity:
          type: number
        nominalVoltage:
          type: number
        manufacturer:
          type: string
        serialNumber:
          type: string
    BatteryStateData:
      title: Battery state information
      type: object
      properties:
        stateOfCharge:
          type: number
        stateOfHealth:
          type: number
        temperature:
          type: number
        errorState:
          type: string
        operatingState:
          type: string
        chargingState:
          type: string
    BatteryMeasurements:
      title: Battery measurement data
      type: object
      properties:
        power:
          type: number
        current:
          type: number
        voltage:
          type: number
        energyProduced:
          type: number
        energyConsumed:
          type: number
    InverterIdentification:
      title: Inverter manufacturer identification data
      type: object
      properties:
        manufacturer:
          type: string
        serialNumber:
          type: string
        softwareRev:
          type: string
        hardwareRev:
          type: string
        gridCode:
          type: string
        inverterType:
          type: string
    InverterState:
      title: Inverter operating state
      type: object
      properties:
        operatingState:
          type: string
        errorCode:
          type: string
        gridConnectionState:
          type: string
    InverterMeasurementData:
      title: Inverter measurement data
      type: object
      properties:
        power:
          type: array
          items:
            type: number
        energyProduced:
          type: number
        energyConsumed:
          type: number
        current:
          type: array
          items:
            type: number
        voltage:
          type: array
          items:
            type: number
        frequency:
          type: number
    ExternalGridMeasurement:
      title: Aggregated external grid measurement
      type: object
      properties:
        status:
          type: string
        measurement:
          $ref: "#/components/schemas/measurementData"
        totalConsumptionKWh:
          type: number
        totalFeedInKWh:
          type: number
    RemoteDevice:
      title: Remote device information
      type: object
      properties:
        ski:
          type: string
          description: Device SKI
        deviceAddress:
          type: string
          description: Device address
        usecases:
          type: array
          description: List of use cases supported by the device
          items:
            type: object
        features:
          type: array
          description: List of features supported by the device
          items:
            type: string
    OhpcfAnnouncementParams:
      title: OHPCF announcement parameters
      type: object
      properties:
        power:
          type: number
          description: Good approximation of power consumption
        powerMax:
          type: number
          description: Maximum power consumption
        activeDurationMinSeconds:
          type: number
          description: Minimum active duration in seconds
        pauseDurationMinSeconds:
          type: number
          description: Minimum pause duration in seconds
        isPausable:
          type: boolean
          description: Whether the process can be paused
        isStoppable:
          type: boolean
          description: Whether the process can be stopped
    DeviceStateData:
      title: Device state information
      type: object
      properties:
        operatingState:
          type: string
          description: Current operating state
        errorCode:
          type: string
          description: Error code if any
    CSState:
      title: Controllable System State
      type: string
      enum:
        - Init
        - Limited
        - Unlimited/Controlled
        - Failsafe
        - Unlimited/Autonomous
    ForceCSStateRequest:
      title: Force Controllable System State request
      type: object
      description: >-
        Testing aid: inject the controllable system into a chosen state once, so a
        tester can start a scenario with the device already in that state. The real
        state machine resumes on the next tick — incoming limit writes are processed
        and transitions out of the forced state follow the normal FSM.
      required:
        - state
      properties:
        state:
          $ref: "#/components/schemas/CSState"
        limitValueInWatts:
          type: number
          description: >-
            Used only when state is "Limited": the power limit the CS reports while
            limited (a positive magnitude; the production LPP CS reports it as
            negative). Required for "Limited" — without it the CS advertises the
            default 0 W limit.
          example: 5000
        durationInSeconds:
          type: number
          description: >-
            Used only when state is "Limited" and durationIndefinite is false: the
            finite duration after which the state machine leaves Limited.
          example: 600
        durationIndefinite:
          type: boolean
          description: >-
            Used only when state is "Limited": when true the limit has no duration and
            persists until another transition; when false a durationInSeconds is required.
          example: false
    ForceCSStateResponse:
      title: Force Controllable System State response
      type: object
      properties:
        state:
          $ref: "#/components/schemas/CSState"
    OhpcfForceStateRequest:
      title: Force HeatPump OHPCF power-sequence state request
      type: object
      description: >-
        Testing aid: inject the heatpump's OHPCF power-sequence (announced
        power-recommendation) state directly, bypassing transition validation.
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - inactive
            - scheduled
            - running
            - paused
            - completed
            - invalid
        powerMaxInWatts:
          type: number
          description: >-
            Announced max power. Required for running and scheduled; optional for paused
            (falls back to a prior announcement). Ignored for inactive/completed/invalid.
          example: 5000
        startDelayInSeconds:
          type: number
          description: >-
            Delay from now until the scheduled run starts. Required for scheduled.
          example: 600
        activeDurationMinInSeconds:
          type: number
          description: >-
            Minimum active duration of the announced process. Optional — falls back to
            the heatpump config, then to a default (300 s).
          example: 300
        pauseDurationMinInSeconds:
          type: number
          description: >-
            Minimum pause duration of the announced process. Optional — falls back to
            the heatpump config, then to a default (60 s).
          example: 60
        isPausable:
          type: boolean
          description: >-
            Whether the announced process can be paused. Optional (default true). At
            least one of isPausable/isStoppable must be true.
          example: true
        isStoppable:
          type: boolean
          description: >-
            Whether the announced process can be stopped. Optional (default true). At
            least one of isPausable/isStoppable must be true.
          example: true
    MeasurementDataElement:
      title: Measurement data element
      type: object
      properties:
        phase:
          type: string
          description: Phase identifier (a, b, c)
        value:
          type: number
          description: Measurement value
        type:
          type: string
          description: Measurement type
    MeasurementDataElementPower:
      title: Power measurement element
      allOf:
        - $ref: "#/components/schemas/MeasurementDataElement"
    MeasurementDataElementCurrent:
      title: Current measurement element
      allOf:
        - $ref: "#/components/schemas/MeasurementDataElement"
    MeasurementDataElementVoltage:
      title: Voltage measurement element
      allOf:
        - $ref: "#/components/schemas/MeasurementDataElement"
    LPCActionResponse:
      title: LPC action response
      type: object
      properties:
        success:
          type: boolean
          description: Whether the action was successful
        data:
          type: object
          description: Response data
        reason:
          type: string
          description: Reason message if action failed
    MGCPEvent:
      title: Consolidated MGCP measurement snapshot delivered to the MA (HEMS) per SPINE notify
      type: object
      properties:
        timestamp: { type: string }
        gcpSki:        { type: string, description: "Remote GCP device SKI" }
        sourceAddress: { type: string, description: "GCP entity SPINE address" }
        entityType:    { type: string, description: "Remote entity type, e.g. GridConnectionPointOfPremises" }
        powerW:            { type: number, description: "Scenario 2 — total active power, W (passive sign)" }
        feedInEnergyKWh:   { type: number, description: "Scenario 3 — cumulative feed-in energy, kWh (positive magnitude)" }
        consumedEnergyKWh: { type: number, description: "Scenario 4 — cumulative consumed energy, kWh (positive magnitude)" }
        currentA: { type: number, description: "Scenario 5 — current phase A, A (passive sign)" }
        currentB: { type: number, description: "Scenario 5 — current phase B, A (passive sign)" }
        currentC: { type: number, description: "Scenario 5 — current phase C, A (passive sign)" }
        voltageAN: { type: number, description: "Scenario 6 — voltage A→N, V" }
        voltageBN: { type: number, description: "Scenario 6 — voltage B→N, V" }
        voltageCN: { type: number, description: "Scenario 6 — voltage C→N, V" }
        voltageAB: { type: number, description: "Scenario 6 — voltage A→B, V" }
        voltageBC: { type: number, description: "Scenario 6 — voltage B→C, V" }
        voltageCA: { type: number, description: "Scenario 6 — voltage C→A, V" }
        frequencyHz: { type: number, description: "Scenario 7 — grid frequency, Hz" }
        valueState: { type: string, enum: [normal, outOfRange, error], description: "[MGCP-003] consolidated state for this notify" }
        reason:     { type: string, description: "Populated when valueState != normal" }
    MGCPMeasurements:
      title: Latest MGCP measurement snapshot the MA (HEMS) holds for a GCP
      type: object
      properties:
        powerW:            { type: number, description: "Scenario 2 — total active power, W (passive sign)" }
        feedInEnergyWh:    { type: number, description: "Scenario 3 — cumulative feed-in energy, Wh (positive magnitude)" }
        consumedEnergyWh:  { type: number, description: "Scenario 4 — cumulative consumed energy, Wh (positive magnitude)" }
        currentA: { type: number, description: "Scenario 5 — current phase A, A (passive sign)" }
        currentB: { type: number, description: "Scenario 5 — current phase B, A (passive sign)" }
        currentC: { type: number, description: "Scenario 5 — current phase C, A (passive sign)" }
        voltageAN: { type: number, description: "Scenario 6 — voltage A→N, V" }
        voltageBN: { type: number, description: "Scenario 6 — voltage B→N, V" }
        voltageCN: { type: number, description: "Scenario 6 — voltage C→N, V" }
        voltageAB: { type: number, description: "Scenario 6 — voltage A→B, V" }
        voltageBC: { type: number, description: "Scenario 6 — voltage B→C, V" }
        voltageCA: { type: number, description: "Scenario 6 — voltage C→A, V" }
        frequencyHz: { type: number, description: "Scenario 7 — grid frequency, Hz" }
        pvCurtailmentLimitFactorPct: { type: number, description: "Scenario 1 — PV feed-in curtailment limit factor, percentage 0-100" }
    LicenseCapability:
      title: Licensable capability
      type: object
      description: >
        A single licensable item (device, use case or feature) with its human readable
        name and whether the current license grants it.
      properties:
        id:
          type: string
          description: Stable identifier, e.g. "inverter", "lpc" or "eebusAnalyzer".
          example: lpc
        name:
          type: string
          description: Full human readable name, e.g. "Limitation of Power Consumption".
          example: Limitation of Power Consumption
        supported:
          type: boolean
          description: Whether the current license grants this capability.
      required:
        - id
        - name
        - supported
    LicenseData:
      title: License information
      type: object
      properties:
        customerName:
          type: string
        email:
          type: string
        issueTime:
          type: string
          format: date-time
        expiryTime:
          type: string
          format: date-time
        valid:
          type: boolean
          description: Whether the license is currently valid (signed, issued and not expired).
        allowedEntities:
          type: array
          description: Raw device kinds granted by the license. Omitted when the license grants all defaults.
          items:
            type: string
          example: ["inverter", "heatpump"]
        allowedUsecases:
          type: array
          description: Raw use case abbreviations granted by the license. Omitted when the license grants all defaults.
          items:
            type: string
          example: ["lpc", "moi"]
        cAllowedUsecases:
          type: array
          description: Use cases the compliance test pipeline may run.
          items:
            type: string
        cAllowedActors:
          type: array
          description: Actors the compliance test pipeline may run.
          items:
            type: string
        devices:
          type: array
          description: >
            The full catalogue of simulated device kinds, mapped from the license's allowed
            entities. Devices the license does not grant are included with supported=false so
            the UI can render them as unavailable. Device kinds granted by the license but
            unknown to this build are appended with supported=true.
          items:
            $ref: "#/components/schemas/LicenseCapability"
        usecases:
          type: array
          description: >
            The full catalogue of use cases, each abbreviation resolved to its full EEBUS name.
            Use cases the license does not grant are included with supported=false. Use cases
            granted by the license but not implemented by this build are appended with
            supported=true.
          items:
            $ref: "#/components/schemas/LicenseCapability"
        features:
          type: array
          description: >
            Non use-case features (shipPairingService, modbusMeter, complianceTests,
            eebusAnalyzer, robotFramework), including the unsupported ones with supported=false.
          items:
            $ref: "#/components/schemas/LicenseCapability"
        spsSupported:
          type: boolean
          description: Whether the SHIP pairing service feature is licensed.
        modbusMeterSupported:
          type: boolean
          description: Whether the Modbus meter feature is licensed.
        complianceTestsSupported:
          type: boolean
          description: Whether the compliance test pipeline feature is licensed.
        eebusAnalyzerSupported:
          type: boolean
          description: Whether the EEBUS Analyzer feature is licensed. When false, all /analyzer/* endpoints return 403.
        robotFrameworkSupported:
          type: boolean
          description: Whether the Robot Framework test layer is licensed.
