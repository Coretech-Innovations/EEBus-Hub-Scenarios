openapi: 3.0.0
info:
  title: EEBUS-Hub
  version: 0.0.0
  description: |-
    This is a yaml file for the EEBus-Hub
servers:
  - url: /api/v1
tags:
  - name: SIM
  - name: EV
  - name: EVSE
  - name: HEMS
  - name: Heat Pump
  - name: Uncontrollable Device
  - name: Energy Meter
  - name: Internal Meter
  - name: Real Devices
  - name: Testing
  - name: Inverter
  - name: ControlBox
  - name: License
  - name: Version
  - name: Updates
paths:
  /sim:
    post:
      tags:
        - SIM
      summary: An Api to handle different actions with Simulation (start,stop,reset)
      operationId: postSimulation
      parameters:
        - name: X-EEBUS-Internal-Test-Token
          in: header
          required: false
          description: Internal token used by test automation to authorize simulation start while a test run is active.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/simulationParameters"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/simulationResponseOk"
        '400':
          description: Unknown action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/simulationResponseBadRequest"
        '409':
          description: Simulation start is blocked while tests are running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    get:
      tags:
        - SIM
      summary: Get Simulation status
      operationId: getSimulationStatus
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  response:
                    $ref: "#/components/schemas/simulationStatus"
  /sim/undo:
    post:
      tags:
        - SIM
      summary: Undo the last action
      operationId: undo
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400': 
          description: nothing to undo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/redo:
    post:
      tags:
        - SIM
      summary: Redo last action has been Undone
      operationId: redo
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400': 
          description: nothing to redo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/speedfactor:
    patch:
      tags:
        - SIM
      summary: Modify speed factor
      operationId: modifySpeedFactor
      requestBody:
        content:
            application/json:
              schema:
               type: object
               properties:
                  speedFactor:
                    type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: 
                 $ref: "#/components/schemas/statusOk"
        '400':
          description: simulation is still running
          content:
            application/json:
              schema: 
                 $ref: "#/components/schemas/statusError"
  /sim/save:
    post:
      tags:
        - SIM
      summary: Save the current state to be exported, This also clear the Undone action
      operationId: save
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
    get:
      tags:
        - SIM
      summary: Update logger data
      operationId: saveupdate
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
               type: object
               properties:
                  status:
                    type: boolean
  /sim/export:
    get:
      tags:
        - SIM
      summary: Export the current configuration to json file
      operationId: exportFile
      responses:
        '200':
          description: Successful response
          content:
            multipart/form-data:
              schema:
                type: string
        '404':
          description: No actions found to be exported
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
        '500':
          description: Failed to encode actions to json
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
  /sim/import:
    post:
      tags:
        - SIM
      summary: Import Configuration to be loaded in the system
      operationId: importFile
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
               type: object
               properties:
                  status:
                    type: boolean
        '400':
          description: File not found, or File size mismatch
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
        '500': 
          description: Failed to load file, Failed to parse Json
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
  /sim/log/start:
    post:
      tags:
        - SIM
      summary: start logging the APIs that backend is receiving
      operationId: startLogging
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: logging has been started before
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
  /sim/log/stop:
    post:
      tags:
        - SIM
      summary: stop logging and get the logs have been saved
      operationId: getLogs
      responses:
        '200':
          description: Successful response
          content:
            multipart/form-data:
              schema:
                type: string
        '400':
          description: no logging have been started to be "Stopped"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/log/clear:
    post:
      tags:
        - SIM
      summary: clear the logs
      operationId: clearLogs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
  /sim/usecases:
    patch:
      tags:
        - SIM
      summary: Enable or disable usecases in runtime
      operationId: usecasesRuntime
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UseCasesAvailability"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  request:
                    $ref: "#/components/schemas/UseCasesAvailability"
    get:
      tags:
        - SIM
      summary: Get usecases availability
      operationId: getUsecasesAvailability
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  usecasesEnable:
                    $ref: "#/components/schemas/UseCasesAvailability"
  /sim/logs/{action}:
    post:
      tags:
        - SIM
      summary: Start or Stop Logging at specific time
      operationId: loggingAction
      parameters:
        - name: action
          in: path
          schema:
            type: string
          required: true
          example: start
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: Invalid action entered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/logs/eebuslogs:
    get:
      tags:
        - SIM
      summary: get the EEBus logs from starting the logging till the stop
      operationId: getEEBusLogs
      responses:
        '200':
          description: Successful response
          content:
            multipart/form-data:
              schema:
                type: string
        '400':
          description: either no logs created, or the logging is not stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/logs/eventlogs:
    get:
      tags:
        - SIM
      summary: get the event logs from starting the logging till the stop
      operationId: getEventLogs
      responses:
        '200':
          description: Successful response
          content:
            multipart/form-data:
              schema:
                type: string
        '400':
          description: either no logs created, or the logging is not stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/logState:
    get:
      tags:
        - SIM
      summary: Get the state of the API logging, if the backend in logging the received APIs or not
      operationId: getAPILoggingState
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APILoggingState"
  /sim/eebuslog:
    get:
      tags:
        - SIM
      summary: Get EEBUS log file
      operationId: getEEBUSLog
      responses:
        '200':
          description: Successful response - file download
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Log file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/eebuslogfile:
    get:
      tags:
        - SIM
      summary: Get EEBUS log file path
      operationId: getEEBUSLogFilePath
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  filepath:
                    type: string
        '404':
          description: Log file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/LPView:
    get:
      tags:
        - SIM
      summary: Get LP logger data
      operationId: getLPView
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - SIM
      summary: Clear LP logger data
      operationId: clearLPView
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/ExportLPView:
    get:
      tags:
        - SIM
      summary: Export LP logs to CSV
      operationId: exportLPView
      responses:
        '200':
          description: Successful response - CSV download
          content:
            text/csv:
              schema:
                type: string
        '404':
          description: No data to export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/MPCLogs:
    get:
      tags:
        - SIM
      summary: Get MPC logger data
      operationId: getMPCLogs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - SIM
      summary: Clear MPC logs
      operationId: clearMPCLogs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/ExportMPCLogs:
    get:
      tags:
        - SIM
      summary: Export MPC logs to CSV
      operationId: exportMPCLogs
      responses:
        '200':
          description: Successful response - CSV download
          content:
            text/csv:
              schema:
                type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/MGCPLogs:
    get:
      tags:
        - SIM
      summary: Get MGCP logger data (per-notify snapshots from MGCP MA callback)
      operationId: getMGCPLogs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MGCPEvent"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - SIM
      summary: Clear MGCP logs
      operationId: clearMGCPLogs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/ExportMGCPLogs:
    get:
      tags:
        - SIM
      summary: Export MGCP logs to CSV
      operationId: exportMGCPLogs
      responses:
        '200':
          description: Successful response - CSV download
          content:
            text/csv:
              schema:
                type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /sim/TCPServer:
    get:
      tags:
        - SIM
      summary: Get TCP server status
      operationId: getTCPServerStatus
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  port:
                    type: string
    patch:
      tags:
        - SIM
      summary: Configure TCP server
      operationId: configureTCPServer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                port:
                  type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: Invalid configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /mdns:
    get:
      summary:  get the available mDNS entries in the network
      operationId: getAvailableMdnsDevices
      responses:
        '200':
          description: successful response
          content:
            application/json:
              schema:
                title: array of the found entries
                type: array
  /ev/view:
    get:
      tags:
        - EV
      summary: Get aggregated EV view data
      operationId: getEVView
      responses:
        '200':
          description: Aggregated simulated and HEMS-discovered remote EV view data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EVViewSnapshot"
        '403':
          description: entity is not licensed
  /ev/add:
    post:
      tags:
        - EV
      summary: Add New EV
      operationId: addEV
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EVConfig" 
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/EVAddResponseOk"
  /ev/list:
    get:
      tags:
        - EV
      summary: List all existed EVs
      operationId: listEVs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/EVList"
  /ev/{evId}:
    patch:
      tags:
        - EV
      summary: Modify EV
      operationId: modifyEV
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EVConfig"
      parameters:
        - name: evId
          in: path
          schema:
            type: integer
          required: true
          example: 2
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                properties:
                  changes:
                    $ref: "#/components/schemas/EVConfig"
                  new:
                    $ref: "#/components/schemas/EVConfig"
                  old:
                    $ref: "#/components/schemas/EVConfig"                
        '400':
          description: invalid ID number
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
        '404':
          description: no existing EV with this ID number
          content:
            application/json:
              schema: 
                 $ref: "#/components/schemas/invalidId"
    get:
      tags:
        - EV
      summary: get EV
      operationId: getEV
      parameters:
        - name: evId
          in: path
          schema:
            type: integer
          required: true
          example: 2
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EVConfig"
                  - type: object
                    properties:
                      evId:
                        type: integer
                      connectedToEVSE:
                        type: boolean
                      evseId:
                        type: integer
        '400':
          description: invalid ID number
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
        '404':
          description: no existing EV with this ID number
          content:
            application/json:
              schema: 
                 $ref: "#/components/schemas/invalidId"
    delete:
      tags:
        - EV
      summary: Delete EV
      operationId: deleteEV
      parameters:
        - name: evId
          in: path
          schema:
            type: integer
          required: true
          example: 2
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/EVDelete"
        '400':
          description: invalid ID number
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
        '404':
          description: no existing EV with this ID number
          content:
            application/json:
              schema: 
                 $ref: "#/components/schemas/invalidId"
  /ev/{evId}/evse/{evseId}:
    post:
      tags:
        - EV
      summary: Connect EV to existing EVSE
      operationId: connectToEVSE
      parameters:
        - name: evId
          in: path
          schema:
            type: integer
          required: true
          example: 2
        - name: evseId
          in: path
          schema:
            type: integer
          required: true
          example: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusOk"
        '400':
          description: invalid ID number
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
        '404':
          description: no existing EV with this ID number
          content:
            application/json:
              schema: 
                 $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - EV
      summary: Disconnect EV from EVSE
      operationId: disconnectFromEVSE
      parameters:
        - name: evId
          in: path
          schema:
            type: integer
          required: true
          example: 2
        - name: evseId
          in: path
          schema:
            type: integer
          required: true
          example: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusOk"
        '400':
          description: invalid ID number
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
        '404':
          description: no existing EV with this ID number
          content:
            application/json:
              schema: 
                 $ref: "#/components/schemas/statusError"
  /ev/{evId}/oscev:
    get:
      tags:
        - EV
      summary: Get EV OSCEV state
      operationId: getEVOSCEVState
      parameters:
        - name: evId
          in: path
          schema:
            type: integer
          required: true
          example: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OscevEVState"
        '400':
          description: invalid ID number or entity is not an EV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          description: OSCEV use case is not licensed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '404':
          description: no existing EV with this ID number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '500':
          description: engine is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
    patch:
      tags:
        - EV
      summary: Update EV OSCEV configuration
      operationId: updateEVOSCEVConfiguration
      parameters:
        - name: evId
          in: path
          schema:
            type: integer
          required: true
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OscevEVPatchRequest"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OscevEVState"
        '400':
          description: invalid request body, invalid ID number, invalid OSCEV value, or entity is not an EV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '403':
          description: OSCEV use case is not licensed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '404':
          description: no existing EV with this ID number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '500':
          description: engine is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /ev/{evId}/image:
    post:
      tags:
        - EV
      summary: Upload Image
      operationId: uploadEVImage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Image"
      parameters:
        - name: evId
          in: path
          schema:
            type: integer
          required: true
          example: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusOk"
        '400':
          description: invalid ID number
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
        '404':
          description: no existing EV with this ID number
          content:
            application/json:
              schema: 
                 $ref: "#/components/schemas/statusError"
    get:
      tags:
        - EV
      summary: Get Image
      operationId: getEVImage
      parameters:
        - name: evId
          in: path
          schema:
            type: integer
          required: true
          example: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/ResponseImage"
        '400':
          description: invalid ID number
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
        '404':
          description: no existing EV with this ID number, no image to get
          content:
            application/json:
              schema: 
                 $ref: "#/components/schemas/statusError"
    delete:
      tags:
        - EV
      summary: Delete Image
      operationId: deleteEVImage
      parameters:
        - name: evId
          in: path
          schema:
            type: integer
          required: true
          example: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusOk"
        '400':
          description: invalid ID number
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/statusError"
        '404':
          description: no existing EV with this ID number, no image to delete
          content:
