            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /heatpump/{heatPumpId}/setState:
    post:
      tags:
        - Heat Pump
      summary: Change OHPCF state with validation
      operationId: setHeatPumpOhpcfState
      parameters:
        - name: heatPumpId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetState:
                  type: string
                  description: Target OHPCF state (inactive, scheduled, running, paused, completed, invalid)
                  example: running
              required:
                - targetState
      responses:
        '200':
          description: State transition successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: State transition successful
                  hpId:
                    type: integer
                    example: 1
                  targetState:
                    type: string
                    example: running
                  currentState:
                    type: string
                    example: running
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid state transition
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    example: State transition not allowed
                  message:
                    type: string
                    example: transition from inactive to running is not allowed per EEBUS OHPCF spec
                  hpId:
                    type: integer
                  targetState:
                    type: string
        '404':
          description: Heat pump not found or OHPCF not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
  /internalmeter:
    get:
