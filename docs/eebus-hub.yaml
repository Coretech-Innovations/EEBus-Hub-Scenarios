    BatteryPatchRequest:
      title: Partial battery configuration update
      description: >-
        Config-only. Every field is optional; an omitted field keeps its current value.
        Testing mode and pinned values are set separately via /battery/mode and
        /battery/values.
      type: object
      properties:
        maxPowerInWatts:
          type: number
          description: Maximum charge/discharge power in W. Must be greater than 0.
        capacityInWattHours:
          type: number
          description: Battery capacity in Wh. Must be greater than 0.
        nominalVoltageInVolts:
          type: number
          description: Battery DC voltage in V. Must be greater than 0.
        stateOfChargeInPercent:
          type: number
          description: Sets the live state of charge, 0..100.
        chargingEnabled:
          type: boolean
        dischargingEnabled:
          type: boolean
    BatteryForcedValuesRequest:
      title: Battery forced-values request
      description: >-
        Body of PATCH /inverter/:id/battery/values — DC/MOB overrides pinned while the
        battery is in testing mode (400 otherwise). Every field optional.
      type: object
      properties:
        forcedPowerInWatts:
          type: number
          description: DC battery power pinned verbatim (positive = charging, negative = discharging).
        forcedCurrentInAmpere:
          type: number
          description: DC current pinned verbatim (else derived from the pinned power).
        forcedVoltageInVolts:
          type: number
          description: DC voltage pinned verbatim (else the configured voltage).
        forcedEnergyChargedInWattHours:
          type: number
          description: MOB energy-charged counter pinned verbatim.
        forcedEnergyDischargedInWattHours:
          type: number
          description: MOB energy-discharged counter pinned verbatim.
        forcedUsableCapacityInWattHours:
          type: number
          description: Usable capacity pinned verbatim.
        forcedStateOfEnergyInWattHours:
          type: number
          description: Remaining energy (state of energy) pinned verbatim.
        forcedOperatingState:
          type: string
          description: >-
            DeviceDiagnosis operating state pinned verbatim. One of normalOperation,
            standby, failure, serviceNeeded, overrideDetected, inAlarm, notReachable,
            finished, temporarilyNotReady, off.
          enum:
            - normalOperation
            - standby
            - failure
            - serviceNeeded
            - overrideDetected
            - inAlarm
            - notReachable
            - finished
            - temporarilyNotReady
            - off
    BatteryStatus:
