              schema:
                $ref: "#/components/schemas/AnalyzerHealth"
        '403':
          description: EEBUS Analyzer feature is not included in the current license. All /analyzer/* endpoints return this status when eebusAnalyzerSupported is false.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /analyzer/capture/start:
    post:
      tags:
        - Analyzer
      summary: Start capturing events
      operationId: startCapture
      description: Enables event capture. Events are dropped (not saved to the ring buffer, SQLite, or SSE stream) until this endpoint is called. No-op when the analyzer is disabled.
      responses:
        '200':
          description: Capture started
          content:
            application/json:
              schema:
                type: object
                properties:
                  capturing:
                    type: boolean
        '503':
          description: Analyzer is disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /analyzer/capture/stop:
    post:
      tags:
        - Analyzer
      summary: Stop capturing events
      operationId: stopCapture
      description: Disables event capture. Events are dropped until startCapture is called again. The active session and its data are preserved for analysis.
      responses:
        '200':
          description: Capture stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  capturing:
                    type: boolean
  /analyzer/capture/mode:
    post:
      tags:
        - Analyzer
      summary: Set the manual-capture mode
      operationId: setCaptureMode
      description: >-
        Switches the analyzer's manual-capture mode and applies it immediately.
        Enabling manual mode (manual=true) stops capture so nothing is recorded
        until the user starts it explicitly. Disabling it (manual=false, the
        default) starts capture so the live session records traffic automatically.
        The mode is independent of momentary start/stop capture actions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                manual:
                  type: boolean
                  description: true to enable manual capture (idle until started), false for automatic capture.
      responses:
        '200':
          description: Mode updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  manualCapture:
                    type: boolean
                  capturing:
                    type: boolean
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '503':
          description: Analyzer is disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
