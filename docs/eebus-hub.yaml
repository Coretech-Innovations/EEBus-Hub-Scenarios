      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalyzerSession"
  /analyzer/sessions/{id}/events:
    get:
      tags:
        - Analyzer
      summary: List session events with optional filters
      operationId: listAnalyzerEvents
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: sinceId, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 500 } }
        - { name: kind, in: query, schema: { type: string }, description: comma-separated event kinds }
        - { name: classifier, in: query, schema: { type: string } }
        - { name: direction, in: query, schema: { type: string, enum: [Send, Recv] } }
        - { name: ski, in: query, schema: { type: string } }
        - { name: sourceDevice, in: query, schema: { type: string }, description: "Substring match on the SPINE source device address (e.g. the shortened device name portion)." }
        - { name: destDevice, in: query, schema: { type: string }, description: "Substring match on the SPINE destination device address." }
        - { name: tail, in: query, schema: { type: boolean }, description: "When true, return the newest `limit` events (ORDER BY seq DESC then re-sorted ASC). Ignored for the live ring-buffer path." }
        - { name: msgCounter, in: query, schema: { type: integer, format: int64 }, description: "Return only the event(s) with this exact SPINE msgCounter value. Combined with ski to avoid cross-device collisions. Used by the UI to resolve a msgCounterRef back to its originating request." }
        - { name: after, in: query, schema: { type: string, format: date-time }, description: "Inclusive lower-bound timestamp filter (RFC3339). When set the full SQLite store is queried so events aged out of the ring are reachable." }
        - { name: before, in: query, schema: { type: string, format: date-time }, description: "Inclusive upper-bound timestamp filter (RFC3339). When set the full SQLite store is queried so events aged out of the ring are reachable." }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AnalyzerEvent" }
                  count: { type: integer }
        '404':
          description: Unknown session
  /analyzer/sessions/{id}/events/count:
    get:
      tags:
        - Analyzer
      summary: Count events matching optional time-range and filters (no payloads returned)
      operationId: countAnalyzerEvents
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: after, in: query, schema: { type: string, format: date-time }, description: "Inclusive lower-bound timestamp (RFC3339)." }
        - { name: before, in: query, schema: { type: string, format: date-time }, description: "Inclusive upper-bound timestamp (RFC3339)." }
        - { name: classifier, in: query, schema: { type: string } }
        - { name: direction, in: query, schema: { type: string, enum: [Send, Recv] } }
        - { name: ski, in: query, schema: { type: string } }
        - { name: sourceDevice, in: query, schema: { type: string }, description: "Substring match on the SPINE source device address." }
        - { name: destDevice, in: query, schema: { type: string }, description: "Substring match on the SPINE destination device address." }
        - { name: kind, in: query, schema: { type: string }, description: comma-separated event kinds }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, format: int64 }
        '503':
          description: Analyzer storage disabled
  /analyzer/sessions/{id}/event/{eventId}:
    get:
      tags: [Analyzer]
      summary: Fetch a single decoded event
      description: Reads from the live ring first, then falls back to the persisted analyzer store so linked events remain available for historical sessions and live events that have aged out of the ring buffer.
      operationId: getAnalyzerEvent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: eventId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyzerEvent" }
        '404':
          description: Unknown session or event not found
  /analyzer/sessions/{id}/timeline:
