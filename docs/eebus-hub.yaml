      summary: Force the HeatPump OHPCF power-sequence state (testing aid)
      description: >-
        Inject the HeatPump's OHPCF power-sequence (announced power-recommendation) state
        directly, bypassing the transition validation of setState. The real state machine
        resumes on the next tick. States that announce power (running/scheduled/paused)
        need a power value; scheduled also needs a start delay.
      operationId: forceHeatPumpOhpcfState
      parameters:
        - name: heatPumpId
          in: path
          schema:
            type: integer
          required: true
          example: 1
      requestBody:
        content:
          application/json:
            schema:
