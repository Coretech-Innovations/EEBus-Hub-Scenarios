      tags:
        - Testing
      summary: Clear selected suites and test cases
      operationId: clearTestingSelection
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"

  /testing/selection/suites/{suite}:
    delete:
      tags:
        - Testing
      summary: Deselect one suite
      operationId: deselectTestingSuite
      parameters:
        - name: suite
          in: path
          schema:
            type: string
          required: true
          example: lpc-cs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '404':
          description: Suite is not selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"

  /testing/selection/testcases/{testCaseId}:
    delete:
      tags:
        - Testing
      summary: Deselect one test case
      operationId: deselectTestingTestCase
      parameters:
        - name: testCaseId
          in: path
          schema:
            type: string
          required: true
          example: LPC_T001
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusOk"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"
        '404':
          description: Test case is not selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"

  /testing/execute:
    post:
      tags:
        - Testing
      summary: Start selected test execution
      operationId: executeTestingRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/testingExecuteRequest"
      responses:
        '202':
          description: Test run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/testingExecuteAcceptedResponse"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusError"

  /testing/run:
    get:
      tags:
        - Testing
      summary: Get current test run status
      operationId: getTestingRunState
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/testingRunState"

  /analyzer/health:
    get:
      tags:
        - Analyzer
      summary: Analyzer health and live counters
      operationId: getAnalyzerHealth
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerHealth"
        '403':
          description: EEBUS Analyzer feature is not included in the current license. All /analyzer/* endpoints return this status when eebusAnalyzerSupported is false.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /analyzer/capture/start:
    post:
      tags:
        - Analyzer
      summary: Start capturing events
      operationId: startCapture
      description: Enables event capture. Events are dropped (not saved to the ring buffer, SQLite, or SSE stream) until this endpoint is called. No-op when the analyzer is disabled.
      responses:
        '200':
          description: Capture started
          content:
            application/json:
              schema:
                type: object
                properties:
                  capturing:
                    type: boolean
        '503':
          description: Analyzer is disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /analyzer/capture/stop:
    post:
      tags:
        - Analyzer
      summary: Stop capturing events
      operationId: stopCapture
      description: Disables event capture. Events are dropped until startCapture is called again. The active session and its data are preserved for analysis.
      responses:
        '200':
          description: Capture stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  capturing:
                    type: boolean
  /analyzer/capture/mode:
    post:
      tags:
        - Analyzer
      summary: Set the manual-capture mode
      operationId: setCaptureMode
      description: >-
        Switches the analyzer's manual-capture mode and applies it immediately.
        Enabling manual mode (manual=true) stops capture so nothing is recorded
        until the user starts it explicitly. Disabling it (manual=false, the
        default) starts capture so the live session records traffic automatically.
        The mode is independent of momentary start/stop capture actions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                manual:
                  type: boolean
                  description: true to enable manual capture (idle until started), false for automatic capture.
      responses:
        '200':
          description: Mode updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  manualCapture:
                    type: boolean
                  capturing:
                    type: boolean
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '503':
          description: Analyzer is disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /analyzer/sessions:
    get:
      tags:
        - Analyzer
      summary: List analyzer sessions
      operationId: listAnalyzerSessions
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalyzerSession"
  /analyzer/sessions/{id}/events:
    get:
      tags:
        - Analyzer
      summary: List session events with optional filters
      operationId: listAnalyzerEvents
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: sinceId, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 500 } }
        - { name: kind, in: query, schema: { type: string }, description: comma-separated event kinds }
        - { name: classifier, in: query, schema: { type: string } }
        - { name: direction, in: query, schema: { type: string, enum: [Send, Recv] } }
        - { name: ski, in: query, schema: { type: string } }
        - { name: sourceDevice, in: query, schema: { type: string }, description: "Substring match on the SPINE source device address (e.g. the shortened device name portion)." }
        - { name: destDevice, in: query, schema: { type: string }, description: "Substring match on the SPINE destination device address." }
        - { name: tail, in: query, schema: { type: boolean }, description: "When true, return the newest `limit` events (ORDER BY seq DESC then re-sorted ASC). Ignored for the live ring-buffer path." }
        - { name: msgCounter, in: query, schema: { type: integer, format: int64 }, description: "Return only the event(s) with this exact SPINE msgCounter value. Combined with ski to avoid cross-device collisions. Used by the UI to resolve a msgCounterRef back to its originating request." }
        - { name: after, in: query, schema: { type: string, format: date-time }, description: "Inclusive lower-bound timestamp filter (RFC3339). When set the full SQLite store is queried so events aged out of the ring are reachable." }
        - { name: before, in: query, schema: { type: string, format: date-time }, description: "Inclusive upper-bound timestamp filter (RFC3339). When set the full SQLite store is queried so events aged out of the ring are reachable." }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AnalyzerEvent" }
                  count: { type: integer }
        '404':
          description: Unknown session
  /analyzer/sessions/{id}/events/count:
    get:
      tags:
        - Analyzer
      summary: Count events matching optional time-range and filters (no payloads returned)
      operationId: countAnalyzerEvents
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: after, in: query, schema: { type: string, format: date-time }, description: "Inclusive lower-bound timestamp (RFC3339)." }
        - { name: before, in: query, schema: { type: string, format: date-time }, description: "Inclusive upper-bound timestamp (RFC3339)." }
        - { name: classifier, in: query, schema: { type: string } }
        - { name: direction, in: query, schema: { type: string, enum: [Send, Recv] } }
        - { name: ski, in: query, schema: { type: string } }
        - { name: sourceDevice, in: query, schema: { type: string }, description: "Substring match on the SPINE source device address." }
        - { name: destDevice, in: query, schema: { type: string }, description: "Substring match on the SPINE destination device address." }
        - { name: kind, in: query, schema: { type: string }, description: comma-separated event kinds }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, format: int64 }
        '503':
          description: Analyzer storage disabled
  /analyzer/sessions/{id}/event/{eventId}:
    get:
      tags: [Analyzer]
      summary: Fetch a single decoded event
      description: Reads from the live ring first, then falls back to the persisted analyzer store so linked events remain available for historical sessions and live events that have aged out of the ring buffer.
      operationId: getAnalyzerEvent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: eventId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyzerEvent" }
        '404':
          description: Unknown session or event not found
  /analyzer/sessions/{id}/timeline:
    get:
      tags: [Analyzer]
      summary: Hierarchical timeline projection
      operationId: getAnalyzerTimeline
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: limit
          in: query
          required: false
          description: Maximum number of timeline items kept per track. Tracks over the limit are compacted into time buckets across the full session so older windows still show activity. Default 5000. Use 0 for no cap.
          schema: { type: integer, minimum: 0, default: 5000 }
      responses:
        '200':
          description: Successful response
          content: { application/json: { schema: { type: object } } }
  /analyzer/sessions/{id}/usecases:
    get:
      tags: [Analyzer]
      summary: Detected SPINE use cases per device
      operationId: getAnalyzerUseCases
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalyzerUseCaseLifecycle"
  /analyzer/sessions/{id}/subscriptions:
    get:
      tags: [Analyzer]
      summary: SPINE subscription lifecycle entries
      operationId: getAnalyzerSubscriptions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /analyzer/sessions/{id}/bindings:
    get:
      tags: [Analyzer]
      summary: SPINE binding lifecycle entries
      operationId: getAnalyzerBindings
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /analyzer/sessions/{id}/metrics:
    get:
      tags: [Analyzer]
      summary: Heartbeat jitter metrics per device pair
      operationId: getAnalyzerMetrics
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  heartbeatJitter:
                    type: array
                    items: { type: object }
  /analyzer/sessions/{id}/metrics/export:
    get:
      tags: [Analyzer]
      summary: Heartbeat metrics as CSV
      operationId: exportAnalyzerMetrics
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content: { text/csv: { schema: { type: string } } }
  /analyzer/sessions/{id}/correlation:
    get:
      tags: [Analyzer]
      summary: Request/response correlation pairs with latency
      operationId: getAnalyzerCorrelation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /analyzer/sessions/{id}/orphaned-requests:
    get:
      tags: [Analyzer]
      summary: Requests without matching reply
      operationId: getAnalyzerOrphans
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /analyzer/sessions/{id}/connections:
    get:
      tags: [Analyzer]
      summary: SHIP connection pairs observed in this session
      description: |
        Returns one entry per unique SHIP connection (identified by the canonical
        sorted pair of SKIs). Two local entities that are connected to each other
        (e.g. an EVSE and a HEMS running in the same hub) are deduplicated into a
        single row. Imported log sessions without lifecycle callbacks are also
        deduplicated by their SPINE device-address pair, so mirrored A→B and B→A
        frames appear as one connection. `isActive` is set when SPINE data frames
        have been observed on the connection; `state` reflects lifecycle
        transitions when present, and historical/imported sessions with no
        lifecycle state are reported as disconnected.
      operationId: getAnalyzerConnections
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ski:                { type: string, description: "Remote peer SHIP SKI" }
                    deviceAddress:      { type: string, description: "Remote SPINE device address (e.g. d:_n:HEMS_1)" }
                    localSki:           { type: string, description: "Local entity SHIP SKI" }
                    localDeviceAddress: { type: string, description: "Local SPINE device address (e.g. d:_n:EVSE_1)" }
                    state:              { type: string, enum: [connected, disconnected], description: "Last lifecycle transition" }
                    isActive:           { type: boolean, description: "True when SPINE data frames have been observed" }
                    startedAt:          { type: string, format: date-time }
                    updatedAt:          { type: string, format: date-time }
                    eventCount:         { type: integer }
                    lastMsgType:        { type: string, description: "SHIP frame msgType of the last frame seen" }
  /analyzer/sessions/{id}/violations:
    get:
      tags: [Analyzer]
      summary: Rule engine violations observed in this session
      operationId: getAnalyzerViolations
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:          { type: integer }
                    ruleId:      { type: string }
                    ruleTitle:   { type: string, description: "Human-readable rule name" }
                    severity:    { type: string, enum: [info, warn, error] }
                    sessionId:   { type: string }
                    eventId:     { type: integer }
                    ski:         { type: string }
                    message:     { type: string }
                    occurredAt:  { type: string, format: date-time }
  /analyzer/sessions/{id}/lifecycle:
    get:
      tags: [Analyzer]
      summary: Per-device per-UC lifecycle checklist
      operationId: getAnalyzerLifecycle
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /analyzer/sessions/{id}/writetracking:
    get:
      tags: [Analyzer]
      summary: LoadControl/Setpoint write history + effective state
      operationId: getAnalyzerWriteTracking
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: object } } } }
  /analyzer/sessions/{id}/descriptions:
    get:
      tags: [Analyzer]
      summary: Measurement / Limit / KeyValue description maps (SKI-scoped)
      operationId: getAnalyzerDescriptions
      description: |
        Scans all descriptor list-data messages in the session and returns
        label maps for measurements, load-control limits, and DeviceConfiguration
        keys. All entries carry a `ski` field so ids from different remote devices
        are kept distinct. Phase information (`acMeasuredPhases`) is derived from
        ElectricalConnectionParameterDescriptionListData and merged onto the
        corresponding measurement description. LimitDesc includes `measurementId`
        to allow the client to chain limitId → measurement → phase/unit.
        This endpoint is polled by the Live Events UI every 3 s.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  measurements:
                    type: array
                    items:
                      type: object
                      properties:
                        ski:             { type: string }
                        measurementId:   { type: integer }
                        scopeType:       { type: string }
                        unit:            { type: string }
                        measurementType: { type: string }
                        phase:           { type: string, description: "acMeasuredPhases from ElectricalConnectionParameterDescriptionListData (e.g. a, b, c, abc)" }
                  limits:
                    type: array
                    items:
                      type: object
                      properties:
                        ski:           { type: string }
                        itemId:        { type: integer }
                        functionSet:   { type: string }
                        measurementId: { type: integer, description: "References MeasurementDescription.measurementId for phase/type enrichment" }
                        scopeType:     { type: string }
                        unit:          { type: string }
                        direction:     { type: string }
                        category:      { type: string }
                  keyValues:
                    type: array
                    items:
                      type: object
                      properties:
                        ski:       { type: string }
                        keyId:     { type: integer }
                        keyName:   { type: string }
                        valueType: { type: string }
                        unit:      { type: string }
  /analyzer/sessions/{id}/depgraph:
    get:
      tags: [Analyzer]
      summary: Device → entity → feature dependency tree
      operationId: getAnalyzerDepgraph
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: object } } } }
  /analyzer/sessions/{id}/export:
    get:
      tags: [Analyzer]
      summary: Export the session as an .eet (NDJSON) trace file
      operationId: exportAnalyzerSession
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content: { application/x-ndjson: { schema: { type: string } } }
  /analyzer/sessions/{id}/bookmarks:
    get:
      tags: [Analyzer]
      summary: List session bookmarks
      operationId: listAnalyzerBookmarks
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
    post:
      tags: [Analyzer]
      summary: Create a bookmark on a session event
      operationId: createAnalyzerBookmark
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messageId: { type: integer, format: int64 }
                label:     { type: string }
                color:     { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object } } } }
  /analyzer/bookmarks/{bookmarkId}:
    delete:
      tags: [Analyzer]
      summary: Delete a bookmark
      operationId: deleteAnalyzerBookmark
      parameters:
        - { name: bookmarkId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Deleted }
        '404': { description: Not found }
  /analyzer/presets:
    get:
      tags: [Analyzer]
      summary: List saved filter presets
      operationId: listAnalyzerPresets
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
    post:
      tags: [Analyzer]
      summary: Save or upsert a filter preset by name
      operationId: saveAnalyzerPreset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:       { type: string }
                filterJson: { type: object }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object } } } }
  /analyzer/presets/{presetId}:
    delete:
      tags: [Analyzer]
      summary: Delete a filter preset
      operationId: deleteAnalyzerPreset
      parameters:
        - { name: presetId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Deleted }
        '404': { description: Not found }
  /analyzer/mdns:
    get:
      tags: [Analyzer]
      summary: List mDNS-discovered EEBUS services
      operationId: listAnalyzerMdns
      parameters:
        - { name: includeSimulated, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /analyzer/sessions/{id}/timeseries:
    get:
      tags: [Analyzer]
      summary: Extract timeseries for a built-in type (measurement|loadcontrol|setpoint)
      operationId: getAnalyzerTimeseries
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: type
          in: query
          schema: { type: string, enum: [measurement, loadcontrol, setpoint], default: measurement }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string }
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        id:    { type: string }
                        label: { type: string }
                        unit:  { type: string }
                        dataPoints:
                          type: array
                          items:
                            type: object
                            properties:
                              ts:       { type: string, format: date-time }
                              value:    { type: number }
                              eventId:  { type: integer, format: int64 }
                              isActive: { type: boolean }
  /analyzer/sessions/{id}/timeseries/discover:
    get:
      tags: [Analyzer]
      summary: Discover which timeseries types have data in this session
      operationId: discoverAnalyzerTimeseries
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /analyzer/import:
    post:
      tags: [Analyzer]
      summary: Import a full .eet/.jsonl/.log file as a new session (single blocking upload)
      operationId: importAnalyzerSession
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: .eet, .jsonl, or .log file to import
      responses:
        '201':
          description: Import complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:     { type: string }
                  eventCount:    { type: integer }
                  schemaVersion: { type: string }
        '400': { description: Parse error or missing file }
        '503': { description: Analyzer storage disabled }
  /analyzer/import/init:
    post:
      tags: [Analyzer]
      summary: Create an empty imported session and return its ID for chunked upload
      operationId: initAnalyzerImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename]
              properties:
                filename:
                  type: string
                  description: Source filename shown in the sessions dropdown
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string }
        '400': { description: Missing or invalid body }
        '503': { description: Analyzer storage disabled }
  /analyzer/import/append:
    post:
      tags: [Analyzer]
      summary: Append a text chunk to an in-progress chunked import
      operationId: appendAnalyzerImportChunk
      description: >
        Parses `chunk` as a sequence of log lines (format=log) or JSONL events
        (format=jsonl) and appends the results to the session created by
        /analyzer/import/init. Chunks MUST be sent serially so seq numbering
        and the session start-time anchor remain consistent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, chunk]
              properties:
                sessionId:
                  type: string
                  description: Session ID returned by /analyzer/import/init
                chunk:
                  type: string
                  description: Raw text chunk (up to ~1000 lines)
                format:
                  type: string
                  enum: [log, jsonl]
                  default: log
      responses:
        '200':
          description: Chunk processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  appended: { type: integer, description: Events parsed from this chunk }
                  total:    { type: integer, description: Total events in the session so far }
                  items:
                    type: array
                    description: Parsed events from this chunk
                    items: { $ref: '#/components/schemas/AnalyzerEvent' }
        '400': { description: Parse error or missing sessionId }
        '404': { description: Session not found }
        '503': { description: Analyzer storage disabled }
  /analyzer/stream:
    get:
      tags: [Analyzer]
      summary: Server-Sent Events feed of new analyzer events
      operationId: getAnalyzerStream
      responses:
        '200':
          description: Successful response
          content: { text/event-stream: { schema: { type: string } } }

components:
  schemas:
    TrustPeerRef:
      type: object
      description: >-
        Identifies one endpoint of a trust connection. Exactly one of `id` or
        `ski` must be set. `id` references a simulated entity by its engine id
        (its SKI is resolved when the simulation starts); `ski` references a real
        device by its 40-character SKI.
      properties:
        id:
          type: integer
          format: uint
          description: Engine id of a simulated entity (mutually exclusive with `ski`).
        ski:
          type: string
          description: SKI of a real device (mutually exclusive with `id`).
    TrustEdge:
      type: object
      description: An undirected mutual-trust connection between two peers.
      required:
        - a
        - b
      properties:
        a:
          $ref: "#/components/schemas/TrustPeerRef"
        b:
          $ref: "#/components/schemas/TrustPeerRef"
    AnalyzerHealth:
      type: object
      properties:
        enabled:
          type: boolean
        capturing:
          type: boolean
          description: Whether event capture is currently active. When false, no events reach the ring buffer, SQLite writer, or SSE hub.
        manualCapture:
          type: boolean
          description: Whether manual-capture mode is active. When true, capture does not auto-start with the hub and must be started explicitly; when false (default), capture auto-starts.
        droppedTotal:
          type: integer
          format: int64
        sessionId:
          type: string
        ringEntries:
          type: integer
    AnalyzerSession:
      type: object
      properties:
