      operationId: getAnalyzerCorrelation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /analyzer/sessions/{id}/orphaned-requests:
    get:
      tags: [Analyzer]
      summary: Requests without matching reply
      operationId: getAnalyzerOrphans
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /analyzer/sessions/{id}/connections:
    get:
      tags: [Analyzer]
      summary: SHIP connection pairs observed in this session
      description: |
        Returns one entry per unique SHIP connection (identified by the canonical
        sorted pair of SKIs). Two local entities that are connected to each other
        (e.g. an EVSE and a HEMS running in the same hub) are deduplicated into a
        single row. Imported log sessions without lifecycle callbacks are also
        deduplicated by their SPINE device-address pair, so mirrored A→B and B→A
        frames appear as one connection. `isActive` is set when SPINE data frames
        have been observed on the connection; `state` reflects lifecycle
        transitions when present, and historical/imported sessions with no
        lifecycle state are reported as disconnected.
      operationId: getAnalyzerConnections
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ski:                { type: string, description: "Remote peer SHIP SKI" }
                    deviceAddress:      { type: string, description: "Remote SPINE device address (e.g. d:_n:HEMS_1)" }
                    localSki:           { type: string, description: "Local entity SHIP SKI" }
                    localDeviceAddress: { type: string, description: "Local SPINE device address (e.g. d:_n:EVSE_1)" }
                    state:              { type: string, enum: [connected, disconnected], description: "Last lifecycle transition" }
                    isActive:           { type: boolean, description: "True when SPINE data frames have been observed" }
                    startedAt:          { type: string, format: date-time }
                    updatedAt:          { type: string, format: date-time }
                    eventCount:         { type: integer }
                    lastMsgType:        { type: string, description: "SHIP frame msgType of the last frame seen" }
  /analyzer/sessions/{id}/violations:
    get:
      tags: [Analyzer]
      summary: Rule engine violations observed in this session
      operationId: getAnalyzerViolations
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:          { type: integer }
                    ruleId:      { type: string }
                    ruleTitle:   { type: string, description: "Human-readable rule name" }
                    severity:    { type: string, enum: [info, warn, error] }
                    sessionId:   { type: string }
                    eventId:     { type: integer }
                    ski:         { type: string }
                    message:     { type: string }
                    occurredAt:  { type: string, format: date-time }
  /analyzer/sessions/{id}/lifecycle:
    get:
      tags: [Analyzer]
      summary: Per-device per-UC lifecycle checklist
      operationId: getAnalyzerLifecycle
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /analyzer/sessions/{id}/writetracking:
    get:
      tags: [Analyzer]
      summary: LoadControl/Setpoint write history + effective state
      operationId: getAnalyzerWriteTracking
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: object } } } }
  /analyzer/sessions/{id}/descriptions:
    get:
      tags: [Analyzer]
      summary: Measurement / Limit / KeyValue description maps (SKI-scoped)
      operationId: getAnalyzerDescriptions
      description: |
        Scans all descriptor list-data messages in the session and returns
        label maps for measurements, load-control limits, and DeviceConfiguration
        keys. All entries carry a `ski` field so ids from different remote devices
        are kept distinct. Phase information (`acMeasuredPhases`) is derived from
        ElectricalConnectionParameterDescriptionListData and merged onto the
        corresponding measurement description. LimitDesc includes `measurementId`
        to allow the client to chain limitId → measurement → phase/unit.
        This endpoint is polled by the Live Events UI every 3 s.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  measurements:
                    type: array
                    items:
                      type: object
                      properties:
                        ski:             { type: string }
                        measurementId:   { type: integer }
                        scopeType:       { type: string }
                        unit:            { type: string }
                        measurementType: { type: string }
                        phase:           { type: string, description: "acMeasuredPhases from ElectricalConnectionParameterDescriptionListData (e.g. a, b, c, abc)" }
                  limits:
                    type: array
                    items:
                      type: object
                      properties:
                        ski:           { type: string }
                        itemId:        { type: integer }
                        functionSet:   { type: string }
                        measurementId: { type: integer, description: "References MeasurementDescription.measurementId for phase/type enrichment" }
                        scopeType:     { type: string }
                        unit:          { type: string }
                        direction:     { type: string }
                        category:      { type: string }
                  keyValues:
                    type: array
                    items:
                      type: object
                      properties:
                        ski:       { type: string }
                        keyId:     { type: integer }
                        keyName:   { type: string }
                        valueType: { type: string }
                        unit:      { type: string }
  /analyzer/sessions/{id}/depgraph:
    get:
      tags: [Analyzer]
      summary: Device → entity → feature dependency tree
      operationId: getAnalyzerDepgraph
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: object } } } }
  /analyzer/sessions/{id}/export:
    get:
      tags: [Analyzer]
      summary: Export the session as an .eet (NDJSON) trace file
      operationId: exportAnalyzerSession
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content: { application/x-ndjson: { schema: { type: string } } }
  /analyzer/sessions/{id}/bookmarks:
    get:
      tags: [Analyzer]
      summary: List session bookmarks
      operationId: listAnalyzerBookmarks
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
    post:
      tags: [Analyzer]
      summary: Create a bookmark on a session event
      operationId: createAnalyzerBookmark
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messageId: { type: integer, format: int64 }
                label:     { type: string }
                color:     { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object } } } }
  /analyzer/bookmarks/{bookmarkId}:
    delete:
      tags: [Analyzer]
      summary: Delete a bookmark
      operationId: deleteAnalyzerBookmark
      parameters:
        - { name: bookmarkId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Deleted }
        '404': { description: Not found }
  /analyzer/presets:
    get:
      tags: [Analyzer]
      summary: List saved filter presets
      operationId: listAnalyzerPresets
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
    post:
      tags: [Analyzer]
      summary: Save or upsert a filter preset by name
      operationId: saveAnalyzerPreset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:       { type: string }
                filterJson: { type: object }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object } } } }
  /analyzer/presets/{presetId}:
    delete:
      tags: [Analyzer]
      summary: Delete a filter preset
      operationId: deleteAnalyzerPreset
      parameters:
        - { name: presetId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Deleted }
        '404': { description: Not found }
  /analyzer/mdns:
    get:
      tags: [Analyzer]
      summary: List mDNS-discovered EEBUS services
      operationId: listAnalyzerMdns
      parameters:
        - { name: includeSimulated, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /analyzer/sessions/{id}/timeseries:
    get:
      tags: [Analyzer]
      summary: Extract timeseries for a built-in type (measurement|loadcontrol|setpoint)
      operationId: getAnalyzerTimeseries
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: type
          in: query
          schema: { type: string, enum: [measurement, loadcontrol, setpoint], default: measurement }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string }
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        id:    { type: string }
                        label: { type: string }
                        unit:  { type: string }
                        dataPoints:
                          type: array
                          items:
                            type: object
                            properties:
                              ts:       { type: string, format: date-time }
                              value:    { type: number }
                              eventId:  { type: integer, format: int64 }
                              isActive: { type: boolean }
  /analyzer/sessions/{id}/timeseries/discover:
    get:
      tags: [Analyzer]
      summary: Discover which timeseries types have data in this session
      operationId: discoverAnalyzerTimeseries
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /analyzer/import:
    post:
      tags: [Analyzer]
      summary: Import a full .eet/.jsonl/.log file as a new session (single blocking upload)
      operationId: importAnalyzerSession
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: .eet, .jsonl, or .log file to import
      responses:
        '201':
          description: Import complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:     { type: string }
                  eventCount:    { type: integer }
                  schemaVersion: { type: string }
        '400': { description: Parse error or missing file }
        '503': { description: Analyzer storage disabled }
  /analyzer/import/init:
    post:
      tags: [Analyzer]
      summary: Create an empty imported session and return its ID for chunked upload
      operationId: initAnalyzerImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename]
              properties:
                filename:
                  type: string
                  description: Source filename shown in the sessions dropdown
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string }
        '400': { description: Missing or invalid body }
        '503': { description: Analyzer storage disabled }
  /analyzer/import/append:
    post:
      tags: [Analyzer]
      summary: Append a text chunk to an in-progress chunked import
      operationId: appendAnalyzerImportChunk
      description: >
        Parses `chunk` as a sequence of log lines (format=log) or JSONL events
        (format=jsonl) and appends the results to the session created by
        /analyzer/import/init. Chunks MUST be sent serially so seq numbering
        and the session start-time anchor remain consistent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, chunk]
              properties:
                sessionId:
                  type: string
                  description: Session ID returned by /analyzer/import/init
                chunk:
                  type: string
                  description: Raw text chunk (up to ~1000 lines)
                format:
                  type: string
                  enum: [log, jsonl]
                  default: log
      responses:
        '200':
          description: Chunk processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  appended: { type: integer, description: Events parsed from this chunk }
                  total:    { type: integer, description: Total events in the session so far }
                  items:
                    type: array
                    description: Parsed events from this chunk
                    items: { $ref: '#/components/schemas/AnalyzerEvent' }
        '400': { description: Parse error or missing sessionId }
        '404': { description: Session not found }
        '503': { description: Analyzer storage disabled }
  /analyzer/stream:
    get:
      tags: [Analyzer]
      summary: Server-Sent Events feed of new analyzer events
      operationId: getAnalyzerStream
      responses:
        '200':
          description: Successful response
          content: { text/event-stream: { schema: { type: string } } }

components:
  schemas:
    SimulationExport:
      type: object
      description: >-
        Simulation configuration. Imports also accept the legacy bare
        JSON array of action objects exported by older Hub versions.
      required: [actions]
      properties:
        actions:
          type: array
          description: Replayable simulation configuration action log.
          items:
            type: object
            additionalProperties: true
        trustConnections:
          type: array
          description: >-
            Desired mutual-trust topology, restored after device creation. Peer
            ids are references into this export's action log, remapped to the
            live engine ids on import; the reserved id 4294967294 (0xFFFFFFFE)
            refers to the built-in HEMS, which has no create action. Edges whose
            endpoints are not part of the exported configuration are omitted.
          items:
            $ref: "#/components/schemas/TrustEdge"
    TrustPeerRef:
      type: object
      description: >-
        Identifies one endpoint of a trust connection. Exactly one of `id` or
        `ski` must be set. `id` references a simulated entity by its engine id
        (its SKI is resolved when the simulation starts); `ski` references a real
        device by its 40-character SKI.
      properties:
        id:
          type: integer
          format: uint
          description: Engine id of a simulated entity (mutually exclusive with `ski`).
        ski:
          type: string
          description: SKI of a real device (mutually exclusive with `id`).
    TrustEdge:
      type: object
      description: An undirected mutual-trust connection between two peers.
      required:
        - a
        - b
      properties:
        a:
          $ref: "#/components/schemas/TrustPeerRef"
        b:
          $ref: "#/components/schemas/TrustPeerRef"
    TrustEdgeStatus:
      description: >-
        A mutual-trust connection annotated with its live connection state.
        `established` is true only while the simulation is running and the
        underlying SHIP connection is up; a configured-but-not-started topology
        reports `established: false` for every edge.
      allOf:
        - $ref: "#/components/schemas/TrustEdge"
        - type: object
          required:
            - established
          properties:
            established:
              type: boolean
              description: >-
                Whether the SHIP connection for this edge is currently
                established.
    AnalyzerHealth:
      type: object
      properties:
        enabled:
          type: boolean
        capturing:
          type: boolean
          description: Whether event capture is currently active. When false, no events reach the ring buffer, SQLite writer, or SSE hub.
        manualCapture:
          type: boolean
          description: Whether manual-capture mode is active. When true, capture does not auto-start with the hub and must be started explicitly; when false (default), capture auto-starts.
        droppedTotal:
          type: integer
          format: int64
        sessionId:
          type: string
        ringEntries:
          type: integer
    AnalyzerSession:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [live, imported] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        eventCount: { type: integer, format: int64 }
        violationCount: { type: integer, format: int64 }
    AnalyzerEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sessionId: { type: string }
        ts: { type: string, format: date-time }
        monoNs: { type: integer, format: int64 }
        kind:
          type: string
          enum: [ship.frame, ship.lifecycle, spine.message, spine.subscription, spine.binding, spine.entity, spine.device, spine.usecase, analyzer.dropped, analyzer.violation]
        direction: { type: string, enum: [Send, Recv, NA] }
        ski: { type: string }
        actor: { type: string }
        frame:
          type: object
          properties:
            init: { type: boolean }
            msgType: { type: string }
        spine:
          type: object
          properties:
            cmdClassifier: { type: string, enum: [read, reply, write, call, notify, result] }
            functionSet: { type: string }
            msgCounter: { type: integer, format: int64 }
            msgCounterRef: { type: integer, format: int64 }
            ackRequest: { type: boolean }
            sourceDevice: { type: string }
            destDevice: { type: string }
        decoded: { type: object }
    AnalyzerLifecycleStep:
      type: object
      properties:
        name: { type: string }
        status: { type: string, enum: [pass, fail, partial, pending, na] }
        details: { type: string }
    AnalyzerUseCaseLifecycle:
      type: object
      properties:
        deviceAddr: { type: string }
        actor: { type: string }
        useCaseAbbr: { type: string }
        useCaseName: { type: string }
        available: { type: boolean }
        steps:
          type: array
          items:
            $ref: "#/components/schemas/AnalyzerLifecycleStep"
        overallStatus: { type: string, enum: [pass, fail, partial, pending, na] }
    simulationParameters:
      title: action types
      type: object
      properties:
        action:
          type: string
          enum:
            - start
            - stop
            - reset
            - cfgreset
    simulationResponseOk:
      title: response ok for simulation actions
      type: object
      properties:
        status:
          type: string
        request:
          type: object
          properties:
            action:
              type: string
            speedFactor:
              type: number
    simulationResponseBadRequest:
      title: response bad request for simulation action
      type: object
      properties:
        status:
          type: string
        err:
          type: string
        request:
          type: object
          properties:
            action:
              type: string
            speedFactor:
              type: number
    simulationStatus: 
      title: state of simulation
      type: object
      properties:
        state:
          type: string
        speedFactor:
          type: number
        elapsedTime:
          type: integer
    EVConfig:
      title: possible parameters for new EV
      type: object
      properties:
        dischargingEnable:
          type: boolean
        chargingEnable:
          type: boolean
        communicationStandard:
          type: string
          enum:
            - iso15118-2ed1
            - iso15118-2ed2
            - iso61851
        asymmetricCharging:
          type: boolean
        identification:
          type: object
          properties:
            type:
              type: string
              enum:
                - eui64
                - eui48
            value:
              type: string
        device:
          type: object
          properties:
            name:
              type: string
            code:
              type: string
            serialNumber:
              type: string
            softwareRev:
              type: string
            hardwareRev:
              type: string
            vendor:
              type: object
              properties:
                name:
                  type: string
                code:
                  type: string
            brandName:
              type: string
            manufacturer:
              type: object
              properties:
                label:
                  type: string
                description:
                  type: string
            powerLimitsRange:
              type: object
              properties:
                min:
                  type: integer
                max:
                  type: integer
                scale:
                  type: integer
            powerLimitsValue:
              type: object
              properties:
                min:
                  type: integer
                max:
                  type: integer
                scale:
                  type: integer
        currentLimits:
          type: object
          properties:
            min:
              type: integer
              description: current in A
            max:
              type: integer
              description: initial charged percentage
        oscevEnabled:
          type: boolean
        oscevPVChargeMode:
          $ref: "#/components/schemas/OscevPVChargeMode"
        oscevSurplusWithThresholdSupported:
          type: boolean
        oscevSurplusThresholdInWatts:
          type: number
          format: double
        oscevStartDelayInSeconds:
          type: integer
        oscevStopDelayInSeconds:
          type: integer
        imgBase64:
          type: string
          description: Base64 encoded image
        chargingCapacity:
          type: number
          description: battery capacity in kWh
        charged:
          type: number
          description: initial charged percentage (0-100)
        batteryHealth:
          type: number
          description: battery health percentage (0-100)
        operatingState:
          type: string
          enum:
            - normalOperation
            - failure
        opevEnabled:
          type: boolean
          description: OPEV use case enabled
        evsocEnabled:
          type: boolean
          description: EVSOC use case enabled
        dischargeCurrent:
          type: integer
          description: discharge current in A
    Image:
      type: object
      properties:
        image:
          type: string
          description: Base64 encoded image
    EVSEConfig:
      title: possible parameters for EVSE Configuration
      type: object
      properties:
        trustConnections:
          type: array
          description: Optional peers to mutually trust when the simulation starts.
          items:
            $ref: "#/components/schemas/TrustPeerRef"
        deviceName:
          type: string
        deviceCode:
          type: string
        serialNumber:
          type: string
        softwareRev:
          type: string
        hardwareRev:
          type: string
        vendor:
          type: object
          properties:
            name:
              type: string
            code:
              type: string
        brandName:
          type: string
        manufacturer:
          type: object
          properties:
            label:
              type: string
            description:
              type: string
        deviceModel:
          type: string
        imgBase64:
          type: string
        evseccEnabled:
          type: boolean
          description: EVSECC use case enabled
        mpcEnabled:
          type: boolean
          description: MPC use case enabled
        lpcEnabled:
          type: boolean
          description: LPC use case enabled
        failsafeValue:
          type: number
          description: Failsafe power limit value in W
        failsafeDuration:
          type: number
          description: Failsafe duration in hours
        failSafeDurationMax:
          type: number
          description: Maximum failsafe duration in hours
        nominalPower:
          type: object
          properties:
            min:
              type: number
            max:
              type: number
        contractualPowerMax:
          type: number
          description: Maximum contractual power in W
        nominalCurrent:
          type: object
          properties:
            min:
              type: number
            max:
              type: number
        approveWriteLimit:
          type: boolean
          description: Whether to approve write limit operations
    ExtDeviceConfig:
      title: possible parameters for External EVSE, or HEMS
      type: object
      properties:
        deviceName:
          type: string
        remoteSKI:
          type: string
        imgBase64:
          type: string
    ErrorState:
      title: error state parameters
      type: object
      properties:
        lastErrorCode:
          type: string
          description: string to represent error code
    HEMSConfig:
      title: HEMS Configuration parameters
      type: object
      properties:
        DeviceName:
          type: string
          description: Device name
        vendorCode:
          type: string
          description: Vendor code
        deviceBrand:
          type: string
          description: Device brand
        deviceModel:
          type: string
          description: Device model
        serialNumber:
          type: string
          description: Serial number
        imgBase64:
          type: string
          description: Base64 encoded image
        fuseLimit:
          type: number
          description: Fuse limit in A
        quantaTime:
          type: number
          description: Quanta time
        currentIncrementalStep:
          type: number
          description: Current incremental step in A
        stepUpdateDuration:
          type: number
          description: Step update duration
        fuseSafetyMargin:
          type: number
          description: Fuse safety margin in A
        powerTransferDelay:
          type: number
          description: Power transfer delay
        algorithm:
          type: string
          enum:
            - FirstComeFirstServe
            - RoundRobin
          description: Load control algorithm
        lpcUseCaseEnabled:
          type: boolean
          description: LPC use case enabled
        mpcUseCaseEnabled:
          type: boolean
          description: MPC use case enabled
        mobUseCaseEnabled:
          type: boolean
          description: MOB use case enabled
        lppUseCaseEnabled:
          type: boolean
          description: LPP use case enabled
        mgcpUseCaseEnabled:
          type: boolean
          description: MGCP use case enabled
        opevUseCaseEnabled:
          type: boolean
          description: OPEV use case enabled
        evseccUseCaseEnabled:
          type: boolean
          description: EVSECC use case enabled
        evsocUseCaseEnabled:
          type: boolean
          description: EVSOC use case enabled
        moiUseCaseEnabled:
          type: boolean
          description: MOI use case enabled
        ohpcfUseCaseEnabled:
          type: boolean
          description: OHPCF use case enabled
        controllableSystemEnabled:
          type: boolean
          description: Controllable system enabled
        lpcInfo:
          $ref: "#/components/schemas/ControllableSystemInfo"
          description: LPC system information
        lppInfo:
          $ref: "#/components/schemas/ControllableSystemInfo"
          description: LPP system information
        failsafeDuration:
          type: number
          description: Failsafe duration in hours
        failSafeDurationMax:
          type: number
          description: Maximum failsafe duration in hours
        errorState:
          type: string
          enum:
            - Normal Operation
            - Failure
          description: Current error state
        lastErrorCode:
          type: string
          description: Last error code
        heartbeatState:
