      tags: [Analyzer]
      summary: Hierarchical timeline projection
      operationId: getAnalyzerTimeline
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: limit
          in: query
          required: false
          description: Maximum number of timeline items kept per track. Tracks over the limit are compacted into time buckets across the full session so older windows still show activity. Default 5000. Use 0 for no cap.
          schema: { type: integer, minimum: 0, default: 5000 }
      responses:
        '200':
          description: Successful response
          content: { application/json: { schema: { type: object } } }
